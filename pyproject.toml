[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-actions-collection"
version = "1.0.0"
description = "A curated library of reusable GitHub Actions, workflows, and helpers maintained by ESMAD - Instituto Politécnico do Porto"
readme = "README.md"
license = {text = "MIT"}
keywords = ["github-actions", "ci-cd", "automation", "workflows", "devops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
requires-python = ">=3.10"
authors = [
    {name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt"}
]
maintainers = [
    {name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt"}
]

dependencies = [
    "PyYAML >=6.0.3,<7.0.0",
    "tomlkit >=0.14.0,<1.0.0",
    "packaging >=26.0,<27.0.0",
    "requests >=2.32.5,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest >=9.0.2,<10.0.0",
    "pytest-cov >=7.0.0,<8.0.0",
    "ruff >=0.15.1,<1.0.0",
    "mypy >=1.19.1,<2.0.0",
    "types-PyYAML >=6.0.12.20260408,<7.0.0",
    "types-requests >=2.32.4.20260107,<3.0.0",
]

test = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=4.0,<5.0",
]

lint = [
    "ruff>=0.6.0,<1.0",
    "mypy>=1.8.0,<2.0",
    "types-PyYAML>=6.0.12.20260408,<7.0",
    "types-requests>=2.32.0,<3.0",
]

docs = [
    "mkdocs>=1.5.0,<2.0",
    "mkdocs-material>=9.0.0,<10.0",
    "mkdocs-autorefs>=0.5.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/DiogoRibeiro7/gh-actions-collection"
Documentation = "https://github.com/DiogoRibeiro7/gh-actions-collection#readme"
Repository = "https://github.com/DiogoRibeiro7/gh-actions-collection"
"Bug Tracker" = "https://github.com/DiogoRibeiro7/gh-actions-collection/issues"
Changelog = "https://github.com/DiogoRibeiro7/gh-actions-collection/releases"

[project.scripts]
check-imports = "scripts.check_imports_vs_pyproject:main"
migrate-workflows = "scripts.migrate_starter_workflows:main"
pypi-wizard = "scripts.pypi_trusted_publishing_wizard:main"
workflow-generator = "scripts.workflow_generator:main"
smart-deps = "scripts.smart_dependency_update:main"
pyproject-updater = "scripts.pyproject_updater:main"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["scripts*"]

[tool.setuptools.package-data]
"*" = ["*.yml", "*.yaml", "*.md", "*.toml", "py.typed"]

# Ruff configuration
[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "T20", # flake8-print
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
]
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
    ".venv",
    "examples/*/node_modules",
    "examples/*/.yarn",
]

[tool.ruff.per-file-ignores]
"tests/*" = ["T20"]  # Allow print statements in tests
"scripts/*" = ["T20"]  # Allow print statements in scripts

[tool.ruff.isort]
known-first-party = ["scripts"]
force-sort-within-sections = true

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "tomlkit.*",
    "yaml.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
    "--cov=scripts",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
    "--cov-fail-under=70",
]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["scripts"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
