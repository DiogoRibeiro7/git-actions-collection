version: 2
updates:
  # Repository and maintained Node example lockfiles
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/examples/npm-package"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"

  # Python dependencies
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/examples/django-app"
      - "/examples/smart-dependency-update"
      - "/examples/python-package"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "diogoribeiro7"
    labels:
      - "dependencies"
      - "python"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "diogoribeiro7"
    labels:
      - "dependencies"
      - "github-actions"
