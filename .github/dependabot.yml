version: 2
updates:
  # Repository and maintained Node example lockfiles
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/examples/npm-package"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "javascript"

  # Python dependencies
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/examples/django-app"
      - "/examples/smart-dependency-update"
      - "/examples/python-package"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    reviewers:
      - "diogoribeiro7"
    labels:
      - "dependencies"
      - "python"

  # GitHub Actions: workflows, composite actions and consumer examples. One pull
  # request per action keeps every pin of that action on the same commit.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
      - "/examples/*"
      - "/examples/*/*"
    groups:
      github-actions:
        group-by: dependency-name
        patterns:
          - "*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    reviewers:
      - "diogoribeiro7"
    labels:
      - "dependencies"
      - "github-actions"
