name-template: v$NEXT_PATCH_VERSION
tag-template: v$NEXT_PATCH_VERSION
categories:
  - title: Features
    labels:
      - feat
      - feature
  - title: Fixes
    labels:
      - fix
      - bug
  - title: Documentation
    labels:
      - docs
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
template: |
  ## Changes
  $CHANGES
