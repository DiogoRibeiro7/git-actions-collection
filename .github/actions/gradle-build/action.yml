name: "Gradle Build"
description: "Run Gradle build with caching"
inputs:
  java-version:
    description: "Java version to use"
    required: false
    default: "17"
  tasks:
    description: "Gradle tasks to run"
    required: false
    default: "build"
  gradle-args:
    description: "Additional Gradle arguments"
    required: false
    default: "--build-cache"
  working-directory:
    description: "Directory of the Gradle project"
    required: false
    default: "."
runs:
  using: "composite"
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        java-version: ${{ inputs.java-version }}
        distribution: temurin
    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      with:
        gradle-version: wrapper
    - name: Run Gradle
      shell: bash
      run: bash "${{ github.action_path }}/../../../scripts/gradle-build/run.sh"
      env:
        INPUT_TASKS: ${{ inputs.tasks }}
        INPUT_GRADLE_ARGS: ${{ inputs.gradle-args }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
