name: "Python Type Check"
description: "Run mypy static analysis with optional dependency installation"
author: "Diogo Ribeiro <diogo.debastos.ribeiro@gmail.com>"
inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"
  working-directory:
    description: "Directory to run commands in"
    required: false
    default: "."
  requirements-file:
    description: "Optional requirements file to install"
    required: false
    default: ""
  extra-dependencies:
    description: "Space separated list of additional packages to install"
    required: false
    default: ""
  mypy-args:
    description: "Arguments to pass to mypy"
    required: false
    default: "."
  pip-version:
    description: "pip release to install (set to 'latest' to track upstream)"
    required: false
    default: "24.3.1"
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Upgrade pip
      shell: bash
      run: |
        set -euo pipefail
        pip_version="${{ inputs.pip-version }}"
        if [ "$pip_version" = "latest" ]; then
          python -m pip install --upgrade pip
        else
          python -m pip install --upgrade "pip==$pip_version"
        fi
    - name: Install dependencies from requirements file
      if: ${{ inputs.requirements-file != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: python -m pip install -r "${{ inputs.requirements-file }}"
    - name: Install additional dependencies
      if: ${{ inputs.extra-dependencies != '' }}
      shell: bash
      run: python -m pip install ${{ inputs.extra-dependencies }}
    - name: Install mypy
      shell: bash
      run: python -m pip install mypy
    - name: Run mypy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: mypy ${{ inputs.mypy-args }}
