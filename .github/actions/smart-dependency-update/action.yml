name: "Smart Dependency Update"
description: "Batch update dependencies with conflict detection and Dependabot integration"
inputs:
  manifests:
    description: "Space-separated list of manifest files (package.json, pyproject.toml, Cargo.toml, go.mod, Gemfile)"
    required: true
  apply:
    description: "If true, apply updates to manifests"
    required: false
    default: "false"
  batch-size:
    description: "Max number of packages to update"
    required: false
    default: "50"
  dependabot:
    description: "Fetch Dependabot alerts"
    required: false
    default: "false"
  repo:
    description: "owner/repo for Dependabot API"
    required: false
  github-token:
    description: "Token that can read Dependabot alerts (security-events: read), used when dependabot is true"
    required: false
  pip-version:
    description: "pip release to install (set to 'latest' to track upstream)"
    required: false
    default: "26.2.1"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: "3.x"
        cache: pip
    - id: run
      shell: bash
      run: bash "${{ github.action_path }}/../../../scripts/actions/smart-dependency-update/run.sh"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_MANIFESTS: ${{ inputs.manifests }}
        INPUT_APPLY: ${{ inputs.apply }}
        INPUT_BATCH_SIZE: ${{ inputs.batch-size }}
        INPUT_DEPENDABOT: ${{ inputs.dependabot }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_PIP_VERSION: ${{ inputs.pip-version }}
outputs:
  report:
    description: "JSON report of updates, detected conflicts and Dependabot alerts"
    value: ${{ steps.run.outputs.report }}
