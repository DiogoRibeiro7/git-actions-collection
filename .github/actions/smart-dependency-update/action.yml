name: "Smart Dependency Update"
description: "Batch update dependencies with conflict detection and Dependabot integration"
inputs:
  manifests:
    description: "Space-separated list of manifest files"
    required: true
  apply:
    description: "If true, apply updates to manifests"
    required: false
    default: "false"
  batch-size:
    description: "Max number of packages to update"
    required: false
    default: "50"
  dependabot:
    description: "Fetch Dependabot alerts"
    required: false
    default: "false"
  repo:
    description: "owner/repo for Dependabot API"
    required: false
  github-token:
    description: "GitHub token for Dependabot API"
    required: false
  pip-version:
    description: "pip release to install (set to 'latest' to track upstream)"
    required: false
    default: "24.3.1"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.x"
        cache: pip
    - id: run
      shell: bash
      run: bash scripts/actions/smart-dependency-update/run.sh
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_MANIFESTS: ${{ inputs.manifests }}
        INPUT_APPLY: ${{ inputs.apply }}
        INPUT_BATCH_SIZE: ${{ inputs.batch-size }}
        INPUT_DEPENDABOT: ${{ inputs.dependabot }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_PIP_VERSION: ${{ inputs.pip-version }}
outputs:
  report:
    description: "JSON report of updates and conflicts"
    value: ${{ steps.run.outputs.report }}
