name: Benchmark Smoke
description: Run pytest-benchmark and upload results as artifact
inputs:
  python-version:
    description: Python version to use
    required: false
    default: '3.11'
  working-directory:
    description: Directory with tests
    required: false
    default: '.'
  pytest-args:
    description: Extra arguments for pytest
    required: false
    default: ''
  pip-version:
    description: "pip release to install (set to 'latest' to track upstream)"
    required: false
    default: '26.2.1'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install dependencies
      run: bash "${{ github.action_path }}/../../../scripts/benchmark-smoke/install.sh"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_PIP_VERSION: ${{ inputs.pip-version }}
    - name: Run benchmark
      run: bash "${{ github.action_path }}/../../../scripts/benchmark-smoke/run.sh"
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_PYTEST_ARGS: ${{ inputs.pytest-args }}
    - name: Upload results
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: benchmark
        path: ${{ inputs.working-directory }}/benchmark.json
