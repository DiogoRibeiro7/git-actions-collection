name: Benchmark Smoke
description: Run pytest-benchmark and upload results as artifact
inputs:
  python-version:
    description: Python version to use
    required: false
    default: '3.11'
  working-directory:
    description: Directory with tests
    required: false
    default: '.'
  pytest-args:
    description: Extra arguments for pytest
    required: false
    default: ''
  pip-version:
    description: "pip release to install (set to 'latest' to track upstream)"
    required: false
    default: '24.3.1'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install dependencies
      run: bash scripts/benchmark-smoke/install.sh
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_PIP_VERSION: ${{ inputs.pip-version }}
    - name: Run benchmark
      run: bash scripts/benchmark-smoke/run.sh
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_PYTEST_ARGS: ${{ inputs.pytest-args }}
    - name: Upload results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: benchmark
        path: ${{ inputs.working-directory }}/benchmark.json
