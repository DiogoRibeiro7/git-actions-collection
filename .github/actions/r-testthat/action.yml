name: "R Testthat"
description: "Run testthat or devtools::test() for R projects"
author: "Diogo Ribeiro <dfr@esmad.ipp.pt>"
inputs:
  r-version:
    description: "R version to install"
    required: false
    default: "release"
  cran-mirror:
    description: "CRAN mirror to use for package installation"
    required: false
    default: "https://cloud.r-project.org"
  use-public-rspm:
    description: "Leverage the public RStudio Package Manager binaries"
    required: false
    default: "true"
  test-directory:
    description: "Directory containing standalone testthat tests"
    required: false
    default: "tests/testthat"
  install-dependencies:
    description: "Install package dependencies declared in DESCRIPTION"
    required: false
    default: "true"
  additional-packages:
    description: "Additional CRAN packages to install before running tests"
    required: false
    default: ""
  working-directory:
    description: "Directory from which to execute tests"
    required: false
    default: "."
  use-devtools:
    description: "Use devtools::test() when a DESCRIPTION file is present"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - id: package-inputs
      name: Resolve package list
      shell: bash
      run: bash scripts/r-testthat/package-inputs.sh
      env:
        INPUT_USE_DEVTOOLS: ${{ inputs.use-devtools }}
        INPUT_ADDITIONAL_PACKAGES: ${{ inputs.additional-packages }}
    - name: Setup R for testing
      uses: ./.github/actions/setup-r
      with:
        r-version: ${{ inputs.r-version }}
        cran-mirror: ${{ inputs.cran-mirror }}
        use-public-rspm: ${{ inputs.use-public-rspm }}
        packages: ${{ steps.package-inputs.outputs.packages }}
        working-directory: ${{ inputs.working-directory }}
    - name: Run testthat suite
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash scripts/r-testthat/run-tests.sh
      env:
        INPUT_TEST_DIRECTORY: ${{ inputs.test-directory }}
        INPUT_INSTALL_DEPENDENCIES: ${{ inputs.install-dependencies }}
        INPUT_USE_DEVTOOLS: ${{ inputs.use-devtools }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
