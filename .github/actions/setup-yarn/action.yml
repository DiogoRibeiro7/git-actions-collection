name: "Setup Yarn (Corepack) with cache"
description: "Enable Corepack and install dependencies with cache"
inputs:
  node-version:
    description: "Node version"
    required: false
    default: "20"
  working-directory:
    description: "Project directory"
    required: false
    default: "."
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: ${{ inputs.node-version }}

    - name: Enable Corepack
      shell: bash
      run: bash "${{ github.action_path }}/../../../scripts/setup-yarn/corepack.sh"
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}

    - name: Cache Yarn
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: |
          ${{ inputs.working-directory }}/.yarn/cache
          ${{ inputs.working-directory }}/.yarn/patches
          ${{ inputs.working-directory }}/.yarn/unplugged
          ${{ inputs.working-directory }}/.yarn/build-state.yml
          ${{ inputs.working-directory }}/.pnp.cjs
        key: yarn-${{ runner.os }}-${{ hashFiles(format('{0}/yarn.lock', inputs.working-directory)) }}

    - name: Install deps
      shell: bash
      run: bash "${{ github.action_path }}/../../../scripts/setup-yarn/install.sh"
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
