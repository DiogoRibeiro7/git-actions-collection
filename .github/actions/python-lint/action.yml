name: "Python Lint & Type Check"
description: "Run ruff (and optionally mypy) with a given Python version"
inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.12"
  enable-mypy:
    description: "Run mypy type checks"
    required: false
    default: "false"
  working-directory:
    description: "Directory to lint, relative to the workspace"
    required: false
    default: "."
  pip-version:
    description: "pip release to install (set to 'latest' to track upstream)"
    required: false
    default: "26.2.1"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    - name: Install tools
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash "${{ github.action_path }}/../../../scripts/python-lint/run.sh"
      env:
        INPUT_ENABLE_MYPY: ${{ inputs.enable-mypy }}
        INPUT_PIP_VERSION: ${{ inputs.pip-version }}
