name: "Python Lint & Type Check"
description: "Run ruff (and optionally mypy) with a given Python version"
inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.12"
  enable-mypy:
    description: "Run mypy type checks"
    required: false
    default: "false"
  pip-version:
    description: "pip release to install (set to 'latest' to track upstream)"
    required: false
    default: "24.3.1"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    - name: Install tools
      shell: bash
      run: bash "${{ github.action_path }}/../../../scripts/python-lint/run.sh"
      env:
        INPUT_ENABLE_MYPY: ${{ inputs.enable-mypy }}
        INPUT_PIP_VERSION: ${{ inputs.pip-version }}
