name: "Markdown Lint"
description: "Run markdownlint-cli on markdown files"
inputs:
  paths:
    description: "Files, directories or globs to lint, separated by spaces or newlines; node_modules is always skipped, and a list that matches no Markdown file fails"
    required: false
    default: "."
  config-file:
    description: "Path to configuration file"
    required: false
    default: ""
  node-version:
    description: "Node version to use"
    required: false
    default: "24"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install markdownlint-cli
      shell: bash
      run: bash "${{ github.action_path }}/../../../scripts/markdown-lint/run.sh"
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
