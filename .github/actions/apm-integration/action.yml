name: 'APM Integration'
description: 'Send a deployment event to Datadog, New Relic, or Azure Application Insights, and warn when latency exceeds a threshold'
author: 'Diogo Ribeiro'
inputs:
  provider:
    description: 'APM provider: datadog, newrelic, or appinsights'
    required: true
  api-key:
    description: 'API or ingestion key for the provider'
    required: true
  app-id:
    description: 'Application or service identifier (required for New Relic unless api-url is set)'
    required: false
  environment:
    description: 'Deployment environment name'
    required: false
    default: production
  deployment-id:
    description: 'Identifier for the deployment event'
    required: false
    default: ${{ github.sha }}
  metrics-file:
    description: 'Optional JSON file with numeric latency and threshold values; the action warns when latency exceeds threshold'
    required: false
  api-url:
    description: "Full URL to send the event to instead of the provider's default, for another region or a proxy; for New Relic it replaces the need for app-id"
    required: false
runs:
  using: 'composite'
  steps:
    - id: notify
      shell: bash
      run: bash "${{ github.action_path }}/../../../scripts/apm-integration/notify.sh"
      env:
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_APP_ID: ${{ inputs.app-id }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_DEPLOYMENT_ID: ${{ inputs.deployment-id }}
        INPUT_METRICS_FILE: ${{ inputs.metrics-file }}
        INPUT_API_URL: ${{ inputs.api-url }}
