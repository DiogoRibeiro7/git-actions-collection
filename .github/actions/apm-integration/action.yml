name: 'APM Integration'
description: 'Send deployment and custom metrics to APM providers like Datadog, New Relic, and Azure Application Insights'
author: 'Diogo Ribeiro'
inputs:
  provider:
    description: 'APM provider: datadog, newrelic, or appinsights'
    required: true
  api-key:
    description: 'API or ingestion key for the provider'
    required: true
  app-id:
    description: 'Application or service identifier (required for New Relic)'
    required: false
  environment:
    description: 'Deployment environment name'
    required: false
    default: production
  deployment-id:
    description: 'Identifier for the deployment event'
    required: false
    default: ${{ github.sha }}
  metrics-file:
    description: 'Optional JSON file with custom metrics and thresholds'
    required: false
runs:
  using: 'composite'
  steps:
    - id: validate
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.provider }}" in
          datadog|newrelic|appinsights) ;;
          *) echo '::error::Unsupported provider'; exit 1 ;;
        esac
    - id: notify
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        API_KEY: ${{ inputs.api-key }}
        APP_ID: ${{ inputs.app-id }}
        ENVIRONMENT: ${{ inputs.environment }}
        DEPLOYMENT_ID: ${{ inputs.deployment-id }}
        METRICS_FILE: ${{ inputs.metrics-file }}
      run: |
        set -euo pipefail
        case "$PROVIDER" in
          datadog)
            curl -fsS -H "DD-API-KEY:$API_KEY" -H 'Content-Type: application/json' \
              -d "{\"title\":\"Deployment $DEPLOYMENT_ID\",\"text\":\"Environment: $ENVIRONMENT\",\"tags\":[\"env:$ENVIRONMENT\"],\"alert_type\":\"info\"}" \
              https://api.datadoghq.com/api/v1/events
            ;;
          newrelic)
            if [ -z "$APP_ID" ]; then
              echo '::error::app-id is required for New Relic' >&2
              exit 1
            fi
            curl -fsS -H "Api-Key:$API_KEY" -H 'Content-Type: application/json' \
              -d "{\"deployment\":{\"revision\":\"$DEPLOYMENT_ID\",\"user\":\"github-actions\",\"description\":\"Deployment\"}}" \
              "https://api.newrelic.com/v2/applications/$APP_ID/deployments.json"
            ;;
          appinsights)
            curl -fsS -H 'Content-Type: application/json' \
              -d "{\"name\":\"Microsoft.ApplicationInsights.Event\",\"time\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"iKey\":\"$API_KEY\",\"data\":{\"baseType\":\"EventData\",\"baseData\":{\"name\":\"deployment\",\"properties\":{\"deploymentId\":\"$DEPLOYMENT_ID\",\"environment\":\"$ENVIRONMENT\"}}}}" \
              https://dc.services.visualstudio.com/v2/track
            ;;
        esac
        if [ -n "$METRICS_FILE" ]; then
          latency=$(jq -r '.latency // empty' "$METRICS_FILE" || true)
          threshold=$(jq -r '.threshold // empty' "$METRICS_FILE" || true)
          if [ -n "$latency" ] && [ -n "$threshold" ] && [ "$latency" -gt "$threshold" ]; then
            echo "::warning::latency $latency exceeded threshold $threshold"
          fi
        fi
