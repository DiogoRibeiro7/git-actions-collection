name: "R Lint"
description: "Run lintr checks across R sources"
author: "Diogo Ribeiro <dfr@esmad.ipp.pt>"
inputs:
  r-version:
    description: "R version to install"
    required: false
    default: "release"
  cran-mirror:
    description: "CRAN mirror to use for package installation"
    required: false
    default: "https://cloud.r-project.org"
  use-public-rspm:
    description: "Leverage the public RStudio Package Manager binaries"
    required: false
    default: "true"
  targets:
    description: "Comma or newline separated list of files or directories to lint"
    required: false
    default: "R"
  config-file:
    description: "Optional path to a .lintr or lintr config file"
    required: false
    default: ""
  additional-packages:
    description: "Additional CRAN packages to install before linting"
    required: false
    default: ""
  working-directory:
    description: "Directory from which to run lintr"
    required: false
    default: "."
runs:
  using: "composite"
  steps:
    - id: package-inputs
      name: Resolve package list
      shell: bash
      run: bash scripts/r-lint/package-inputs.sh
      env:
        INPUT_ADDITIONAL_PACKAGES: ${{ inputs.additional-packages }}
    - name: Setup R with lintr
      uses: ./.github/actions/setup-r
      with:
        r-version: ${{ inputs.r-version }}
        cran-mirror: ${{ inputs.cran-mirror }}
        use-public-rspm: ${{ inputs.use-public-rspm }}
        packages: ${{ steps.package-inputs.outputs.packages }}
        working-directory: ${{ inputs.working-directory }}
    - name: Run lintr
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bash scripts/r-lint/run-lint.sh
      env:
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_TARGETS: ${{ inputs.targets }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
