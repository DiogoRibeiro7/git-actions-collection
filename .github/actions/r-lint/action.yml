name: "R Lint"
description: "Run lintr checks across R sources"
author: "Diogo Ribeiro <dfr@esmad.ipp.pt>"
inputs:
  r-version:
    description: "R version to install"
    required: false
    default: "release"
  cran-mirror:
    description: "CRAN mirror to use for package installation"
    required: false
    default: "https://cloud.r-project.org"
  use-public-rspm:
    description: "Leverage the public RStudio Package Manager binaries"
    required: false
    default: "true"
  targets:
    description: "Comma or newline separated list of files or directories to lint"
    required: false
    default: "R"
  config-file:
    description: "Optional path to a .lintr or lintr config file"
    required: false
    default: ""
  additional-packages:
    description: "Additional CRAN packages to install before linting"
    required: false
    default: ""
  working-directory:
    description: "Directory from which to run lintr"
    required: false
    default: "."
runs:
  using: "composite"
  steps:
    - id: package-inputs
      name: Resolve package list
      shell: bash
      run: |
        extras="${{ inputs.additional-packages }}"
        if [ -n "$extras" ]; then
          echo "packages=lintr,$extras" >> "$GITHUB_OUTPUT"
        else
          echo "packages=lintr" >> "$GITHUB_OUTPUT"
        fi
    - name: Setup R with lintr
      uses: ./.github/actions/setup-r
      with:
        r-version: ${{ inputs.r-version }}
        cran-mirror: ${{ inputs.cran-mirror }}
        use-public-rspm: ${{ inputs.use-public-rspm }}
        packages: ${{ steps.package-inputs.outputs.packages }}
        working-directory: ${{ inputs.working-directory }}
    - name: Run lintr
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        Rscript - <<'RSCRIPT'
        options(error = function(e) { message(conditionMessage(e)); quit(status = 1) })
        suppressPackageStartupMessages(library(lintr))

        config_file <- "${{ inputs.config-file }}"
        if (nzchar(config_file)) {
          message(sprintf("Using lintr config: %s", config_file))
          Sys.setenv(LINTR_CONFIG = config_file)
        }

        target_input <- "${{ inputs.targets }}"
        targets <- unlist(strsplit(target_input, "[,\n ]+"))
        targets <- targets[nzchar(targets)]
        if (!length(targets)) {
          targets <- c("R")
        }

        lint_results <- lapply(targets, function(path) {
          if (dir.exists(path)) {
            lintr::lint_dir(path = path, parse_settings = TRUE)
          } else if (file.exists(path)) {
            lintr::lint(path = path, parse_settings = TRUE)
          } else {
            message(sprintf("Target '%s' not found. Skipping.", path))
            structure(list(), class = "lintr_lints")
          }
        })

        total_lints <- sum(vapply(lint_results, length, integer(1)))
        if (total_lints > 0) {
          invisible(lapply(lint_results, function(lints) {
            if (length(lints)) print(lints)
          }))
          stop(sprintf("lintr found %d issue(s).", total_lints))
        }

        message("lintr completed without findings.")
        RSCRIPT
