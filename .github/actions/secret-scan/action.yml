name: Secret Scan
description: Scan repository for leaked secrets using gitleaks
inputs:
  args:
    description: "Arguments passed to `gitleaks detect`, separated by spaces or newlines; `--redact` is always added first"
    required: false
    default: '--no-git -v'
runs:
  using: composite
  steps:
    - name: Install gitleaks
      shell: bash
      run: bash "${{ github.action_path }}/../../../scripts/secret-scan/install.sh"

    - name: Run gitleaks
      shell: bash
      run: bash "${{ github.action_path }}/../../../scripts/secret-scan/scan.sh"
      env:
        INPUT_ARGS: ${{ inputs.args }}
