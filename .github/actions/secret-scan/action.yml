name: Secret Scan
description: Scan repository for leaked secrets using gitleaks
inputs:
  args:
    description: Arguments passed to gitleaks
    required: false
    default: '--no-git -v'
runs:
  using: composite
  steps:
    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
      env:
        GITLEAKS_VERSION: 8.28.0
      with:
        args: ${{ inputs.args }}
