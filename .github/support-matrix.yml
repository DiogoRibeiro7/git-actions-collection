version: 1

definitions:
  supported: >
    Public surface intended to remain compatible within the current major
    release. Changes require regression coverage and should not break
    documented inputs, outputs, secrets, or expected behaviour.
  reference: >
    Useful reusable automation with examples or static validation, but without
    enough direct behavioural coverage to be part of the v1 compatibility
    promise yet.
  experimental: >
    Automation that performs publishing, deployment, migration, or other
    environment-dependent operations and has not yet earned stable v1 status.
  internal: >
    Repository-maintenance workflows that are not part of the consumer API.

composite_actions:
  supported:
    - apm-integration
    - aws-lambda-build
    - benchmark-smoke
    - check-imports
    - gradle-build
    - markdown-lint
    - pr-template-enforcer
    - python-lint
    - python-type-check
    - r-lint
    - r-testthat
    - secret-scan
    - setup-poetry
    - setup-r
    - setup-yarn
    - smart-dependency-update
  reference: []
  experimental: []

workflows:
