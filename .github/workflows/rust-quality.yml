name: Rust Quality

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: Rust toolchain used for formatting and Clippy
        type: string
        default: stable
      working-directory:
        description: Directory containing Cargo.toml
        type: string
        default: .
      locked:
        description: Require Cargo.lock to remain unchanged during Clippy
        type: boolean
        default: true
      features:
        description: Comma-separated Cargo features to enable for Clippy
        type: string
        default: ''
      all-features:
        description: Enable all Cargo features for Clippy
        type: boolean
        default: false
      no-default-features:
        description: Disable default Cargo features for Clippy
        type: boolean
        default: false
      run-format:
        description: Run cargo fmt --all --check
        type: boolean
        default: true
      run-clippy:
        description: Run cargo clippy with warnings denied
        type: boolean
        default: true
      use-cache:
        description: Restore and save a best-effort Cargo dependency/build cache
        type: boolean
        default: true
      cache-targets:
        description: Cache workspace target directories in addition to the Cargo registry
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality:
    name: Rust format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: rustfmt, clippy

      - name: Restore Rust cache
        if: inputs.use-cache
        continue-on-error: true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: ${{ inputs.working-directory }} -> target
          cache-targets: ${{ inputs.cache-targets }}
          cache-on-failure: false

      - name: Validate Rust project
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          CARGO_ALL_FEATURES: ${{ inputs.all-features }}
          CARGO_NO_DEFAULT_FEATURES: ${{ inputs.no-default-features }}
          CARGO_FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail

          if [ ! -f Cargo.toml ]; then
            echo "Cargo.toml not found in ${{ inputs.working-directory }}" >&2
            exit 1
          fi

          if [[ "$CARGO_ALL_FEATURES" == "true" && "$CARGO_NO_DEFAULT_FEATURES" == "true" ]]; then
            echo "all-features and no-default-features cannot both be enabled" >&2
            exit 1
          fi

          if [[ "$CARGO_ALL_FEATURES" == "true" && -n "$CARGO_FEATURES" ]]; then
            echo "all-features cannot be combined with an explicit feature list" >&2
            exit 1
          fi

      - name: Format check
        if: inputs.run-format
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: cargo fmt --all --check

      - name: Clippy
        if: inputs.run-clippy
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          CARGO_LOCKED: ${{ inputs.locked }}
          CARGO_ALL_FEATURES: ${{ inputs.all-features }}
          CARGO_NO_DEFAULT_FEATURES: ${{ inputs.no-default-features }}
          CARGO_FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          args=(--workspace --all-targets)
          [[ "$CARGO_LOCKED" == "true" ]] && args+=(--locked)
          [[ "$CARGO_ALL_FEATURES" == "true" ]] && args+=(--all-features)
          [[ "$CARGO_NO_DEFAULT_FEATURES" == "true" ]] && args+=(--no-default-features)
          [[ -n "$CARGO_FEATURES" ]] && args+=(--features "$CARGO_FEATURES")
          cargo clippy "${args[@]}" -- -D warnings
