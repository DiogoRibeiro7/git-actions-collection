name: R Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.R'
      - '**/*.Rmd'
      - '**/.lintr'
      - '.lintr'
      - '.github/actions/r-lint/**'
      - '.github/actions/setup-r/**'
      - '.github/workflows/r-lint.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Run lintr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run R lintr checks
        uses: ./.github/actions/r-lint
        with:
          targets: |
            R
            scripts
            tests
