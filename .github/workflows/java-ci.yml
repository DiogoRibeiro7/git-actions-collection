# Runs tests with Maven (mvn -B test) or the Gradle wrapper (./gradlew test) on Temurin JDK 17.
name: Java CI

on:
  workflow_call:
    inputs:
      build-tool:
        description: Build system (maven or gradle)
        required: false
        type: string
        default: maven

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Any other value would skip both test steps and pass without testing anything.
      - name: Check build tool
        shell: bash
        env:
          BUILD_TOOL: ${{ inputs.build-tool }}
        run: |
          case "$BUILD_TOOL" in
            maven|gradle) ;;
            *) echo "::error::build-tool must be maven or gradle, not '$BUILD_TOOL'"; exit 1 ;;
          esac
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Maven Test
        if: ${{ inputs.build-tool == 'maven' }}
        run: mvn -B test
      - name: Gradle Test
        if: ${{ inputs.build-tool == 'gradle' }}
        run: ./gradlew test
