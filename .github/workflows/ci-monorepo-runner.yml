name: CI Monorepo Runner

on:
  workflow_call:
    inputs:
      kind:
        description: "One of: python,node,java,go,rust,terraform,helm,k8s,docker"
        required: true
        type: string
      working-directory:
        description: "Folder to run in"
        required: true
        type: string

permissions:
  contents: read

jobs:
  run-kind:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
        shell: bash
    steps:
      - uses: actions/checkout@5

      # --- Common: actionlint for any nested workflows under this path
      - name: Install actionlint
        run: |
            set -euo pipefail
            url=$(curl -s https://api.github.com/repos/rhysd/actionlint/releases/latest \
            | grep -oP '(?<=browser_download_url": ")[^"]*linux_amd64\.tar\.gz')
            curl -sSL "$url" | tar -xz
            sudo mv actionlint /usr/local/bin/

      - name: Lint workflows (if present)
        run: |
          set -euo pipefail
          dir="${{ inputs.working-directory }}/.github/workflows"
          if [ -d "$dir" ]; then
            find "$dir" -type f \( -name '*.yml' -o -name '*.yaml' \) \
              -print0 | xargs -0 -r -n1 actionlint
          fi

      # --- Kind-specific setup
      - name: Setup Python
        if: inputs.kind == 'python' || inputs.kind == 'monorepo'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        if: inputs.kind == 'node' || inputs.kind == 'monorepo'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        if: inputs.kind == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        if: inputs.kind == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Setup Rust
        if: inputs.kind == 'rust'
        uses: dtolnay/rust-toolchain@1d0fa839ab7bb8288b370fd8eeb8ba8a6b2dbb20

      - name: Install Helm
        if: inputs.kind == 'helm'
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Install kubeconform
        if: inputs.kind == 'k8s'
        run: |
          set -euo pipefail
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kubeconform /usr/local/bin/

      - name: Setup Terraform
        if: inputs.kind == 'terraform' || inputs.kind == 'monorepo'
        uses: hashicorp/setup-terraform@3
        with:
          terraform_version: latest

      # --- Kind-specific commands
      - name: Python tests
        if: inputs.kind == 'python'
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          pytest -q

      - name: Node checks
        if: inputs.kind == 'node'
        run: |
          set -euo pipefail
          corepack enable
          yarn -v
          node -v
          if [ -f package.json ]; then
            if jq -e '.scripts.test' package.json >/dev/null 2>&1; then
              yarn install --immutable || npm ci
              yarn test -s || npm test -s
            fi
          fi

      - name: Java tests
        if: inputs.kind == 'java'
        run: mvn -q -B -DskipTests=false test

      - name: Rust check
        if: inputs.kind == 'rust'
        run: cargo check

      - name: Go test
        if: inputs.kind == 'go'
        run: go test ./...

      - name: Terraform init
        if: inputs.kind == 'terraform'
        run: |
          terraform -version
          terraform -chdir=. init -backend=false

      - name: Kubernetes manifests lint
        if: inputs.kind == 'k8s'
        run: kubeconform -summary *.yaml || true

      - name: Helm lint and template
        if: inputs.kind == 'helm'
        run: |
          helm lint .
          helm template . --dry-run

      - name: Docker build
        if: inputs.kind == 'docker'
        run: docker build .
