# Runs actionlint, then one directory check selected by kind: pytest, Node tests, mvn test, cargo
# check, go test, terraform init, kubeconform, helm lint/template, or docker build.
name: CI Monorepo Runner

on:
  workflow_call:
    inputs:
      kind:
        description: "One of: python,node,java,go,rust,terraform,helm,k8s,docker"
        required: true
        type: string
      working-directory:
        description: "Folder to run in"
        required: true
        type: string

permissions:
  contents: read

jobs:
  run-kind:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # --- Common: actionlint for any nested workflows under this path
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $archive" | sha256sum --check --quiet
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      # Steps already run in inputs.working-directory.
      - name: Lint workflows (if present)
        run: |
          set -euo pipefail
          dir=".github/workflows"
          if [ -d "$dir" ]; then
            find "$dir" -type f \( -name '*.yml' -o -name '*.yaml' \) \
              -print0 | xargs -0 -r -n1 actionlint
          fi

      # --- Kind-specific setup
      - name: Setup Python
        if: inputs.kind == 'python' || inputs.kind == 'monorepo'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Setup Node.js
        if: inputs.kind == 'node' || inputs.kind == 'monorepo'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Setup Java
        if: inputs.kind == 'java'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        if: inputs.kind == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.22.x'

      - name: Setup Rust
        if: inputs.kind == 'rust'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - name: Install Helm
        if: inputs.kind == 'helm'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v4.3.0

      - name: Install kubeconform
        if: inputs.kind == 'k8s'
        env:
          VERSION: v0.8.0
          SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kubeconform.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/yannh/kubeconform/releases/download/$VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$SHA256  $archive" | sha256sum --check --quiet
          mkdir -p "$RUNNER_TEMP/kubeconform"
          tar -xzf "$archive" -C "$RUNNER_TEMP/kubeconform"
          echo "$RUNNER_TEMP/kubeconform" >> "$GITHUB_PATH"

      - name: Setup Terraform
        if: inputs.kind == 'terraform' || inputs.kind == 'monorepo'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.16.4

      # --- Kind-specific commands
      - name: Python tests
        if: inputs.kind == 'python'
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then
            python -m pip install -q -r requirements.txt
          fi
          # pytest-cov because coverage options in pytest config are common;
          # `python -m pytest` puts the folder on sys.path so local packages import.
          python -m pip install -q pytest pytest-cov
          python -m pytest -q

      - name: Node checks
        if: inputs.kind == 'node'
        run: |
          set -euo pipefail
          # Node.js 25 and newer no longer bundle Corepack.
          if [ "$(node -p 'process.versions.node.split(".")[0]')" -ge 25 ]; then
            npm install --global corepack@0.36.0
          fi
          corepack enable
          yarn -v
          node -v
          if [ -f package.json ]; then
            if jq -e '.scripts.test' package.json >/dev/null 2>&1; then
              yarn install --immutable || npm ci
              yarn test -s || npm test -s
            fi
          fi

      - name: Java tests
        if: inputs.kind == 'java'
        run: mvn -q -B -DskipTests=false test

      - name: Rust check
        if: inputs.kind == 'rust'
        run: cargo check

      - name: Go test
        if: inputs.kind == 'go'
        run: go test ./...

      - name: Terraform init
        if: inputs.kind == 'terraform'
        run: |
          set -euo pipefail
          terraform -version
          terraform init -backend=false
          terraform validate

      - name: Kubernetes manifests lint
        if: inputs.kind == 'k8s'
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(./*.yaml ./*.yml)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No Kubernetes manifests in $PWD"
            exit 0
          fi
          # Custom resources have no upstream schema; validate everything else.
          kubeconform -summary -ignore-missing-schemas "${manifests[@]}"

      - name: Helm lint and template
        if: inputs.kind == 'helm'
        run: |
          helm lint .
          helm template . --dry-run=client

      - name: Docker build
        if: inputs.kind == 'docker'
        run: docker build .
