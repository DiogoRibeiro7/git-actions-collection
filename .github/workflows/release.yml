# Runs pinned semantic-release (Node 24 by default) with the git, changelog and GitHub plugins and
# conventionalcommits preset available, driven by the caller's release config.
name: Semantic Release
on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node version for semantic-release'
        required: false
        type: string
        default: '24'
    secrets:
      NPM_TOKEN:
        description: 'npm token for configs that publish with @semantic-release/npm'
        required: false
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ inputs.node-version }}
      # `npm i -D` added these tools to the caller's package.json and lockfile, which the git
      # plugin then committed. npx -p installs them outside the project. The preset stays on
      # 9.x: 10.x needs a newer changelog writer than semantic-release 25 bundles.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npx --yes \
            -p semantic-release@25.0.9 \
            -p @semantic-release/git@11.0.1 \
            -p @semantic-release/changelog@7.0.0 \
            -p @semantic-release/github@12.0.10 \
            -p conventional-changelog-conventionalcommits@9.3.1 \
            semantic-release
