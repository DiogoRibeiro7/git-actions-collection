name: Test Python Test Matrix Workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/python-test-matrix.yml'
      - '.github/workflows/test-python-test-matrix.yml'
      - 'tests/python-test-matrix/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  success:
    uses: ./.github/workflows/python-test-matrix.yml
    with:
      python-versions: '["3.11"]'
      os-matrix: '["ubuntu-latest"]'
      test-command: 'pytest -q -o addopts="" tests/python-test-matrix/test_success.py'

  matrix-combo:
    uses: ./.github/workflows/python-test-matrix.yml
    with:
      python-versions: '["3.10","3.11"]'
      os-matrix: '["ubuntu-latest"]'
      test-command: 'pytest -q -o addopts="" tests/python-test-matrix/test_success.py'
