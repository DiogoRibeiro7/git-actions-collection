# Runs terraform init, validate and plan (Terraform 1.8.5), posts the plan output as a sticky
# pull request comment, and fails when the plan fails.
name: Terraform Plan (PR comment)
on:
  workflow_call:
    inputs:
      working-directory:
        description: "Path containing Terraform code"
        required: false
        type: string
        default: "."
permissions:
  contents: read
  pull-requests: write
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.8.5
      - name: Init
        working-directory: ${{ inputs.working-directory }}
        run: terraform init -input=false
      - name: Validate
        working-directory: ${{ inputs.working-directory }}
        run: terraform validate
      # Capture the plan and its exit code so a failed plan is still posted, then fail below.
      - name: Plan
        id: tfplan
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          set +e
          terraform plan -no-color -input=false > plan.txt 2>&1
          status=$?
          cat plan.txt
          echo "exit-code=$status" >> "$GITHUB_OUTPUT"
      - name: Comment PR with plan
        if: github.event_name == 'pull_request' || github.event.pull_request.number != ''
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
        with:
          header: terraform-plan
          recreate: true
          path: ${{ inputs.working-directory }}/plan.txt
      - name: Fail when the plan failed
        if: steps.tfplan.outputs.exit-code != '0'
        env:
          PLAN_EXIT_CODE: ${{ steps.tfplan.outputs.exit-code }}
        run: |
          echo "::error::terraform plan exited with status $PLAN_EXIT_CODE"
          exit 1
