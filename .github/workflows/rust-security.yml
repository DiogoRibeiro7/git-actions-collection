# Audits Cargo.lock against the RustSec database with cargo-audit, generating the lockfile if
# missing, and optionally enforces cargo-deny advisory, ban, license and source policies.
name: Rust Security

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: Rust toolchain used when resolving a missing lockfile
        type: string
        default: stable
      working-directory:
        description: Directory containing Cargo.toml
        type: string
        default: .
      generate-lockfile:
        description: Generate Cargo.lock when the repository does not commit one
        type: boolean
        default: true
      ignored-advisories:
        description: Comma-separated RustSec advisory IDs to ignore
        type: string
        default: ''
      run-cargo-audit:
        description: Run RustSec cargo-audit
        type: boolean
        default: true
      run-cargo-deny:
        description: Run cargo-deny policy checks
        type: boolean
        default: false
      cargo-deny-config:
        description: Path to cargo-deny policy file, relative to working-directory
        type: string
        default: deny.toml
      cargo-deny-checks:
        description: Comma-separated cargo-deny checks to run
        type: string
        default: advisories,bans,licenses,sources

permissions:
  contents: read

jobs:
  audit:
    name: RustSec cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: Validate Rust project
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ ! -f Cargo.toml ]; then
            echo "Cargo.toml not found in ${{ inputs.working-directory }}" >&2
            exit 1
          fi

      - name: Resolve missing lockfile
        if: inputs.generate-lockfile && (inputs.run-cargo-audit || inputs.run-cargo-deny)
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi

      - name: Require Cargo.lock
        if: inputs.run-cargo-audit || inputs.run-cargo-deny
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ ! -f Cargo.lock ]; then
            echo "Cargo.lock is required for cargo-audit. Commit one or enable generate-lockfile." >&2
            exit 1
          fi

      - name: Install cargo-audit
        if: inputs.run-cargo-audit
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5
        with:
          tool: cargo-audit@0.22.2

      - name: Audit Rust dependencies
        if: inputs.run-cargo-audit
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          CARGO_AUDIT_IGNORE: ${{ inputs.ignored-advisories }}
        run: |
          set -euo pipefail
          args=()

          if [ -n "$CARGO_AUDIT_IGNORE" ]; then
            IFS=',' read -ra advisory_ids <<< "$CARGO_AUDIT_IGNORE"
            for raw_id in "${advisory_ids[@]}"; do
              advisory_id="${raw_id//[[:space:]]/}"
              if [ -n "$advisory_id" ]; then
                args+=(--ignore "$advisory_id")
              fi
            done
          fi

          cargo audit "${args[@]}"

      - name: Validate cargo-deny policy
        if: inputs.run-cargo-deny
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          CARGO_DENY_CONFIG: ${{ inputs.cargo-deny-config }}
          CARGO_DENY_CHECKS: ${{ inputs.cargo-deny-checks }}
        run: |
          set -euo pipefail

          if [ ! -f "$CARGO_DENY_CONFIG" ]; then
            echo "cargo-deny policy file not found: $CARGO_DENY_CONFIG" >&2
            exit 1
          fi

          if [ -z "$CARGO_DENY_CHECKS" ]; then
            echo "cargo-deny-checks cannot be empty when cargo-deny is enabled" >&2
            exit 1
          fi

          IFS=',' read -ra checks <<< "$CARGO_DENY_CHECKS"
          for raw_check in "${checks[@]}"; do
            check="${raw_check//[[:space:]]/}"
            case "$check" in
              advisories|bans|licenses|sources) ;;
              *)
                echo "Unsupported cargo-deny check: $check" >&2
                exit 1
                ;;
            esac
          done

      - name: Install cargo-deny
        if: inputs.run-cargo-deny
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5
        with:
          tool: cargo-deny@0.20.2

      - name: Enforce Rust dependency policy
        if: inputs.run-cargo-deny
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          CARGO_DENY_CONFIG: ${{ inputs.cargo-deny-config }}
          CARGO_DENY_CHECKS: ${{ inputs.cargo-deny-checks }}
        run: |
          set -euo pipefail
          args=()

          IFS=',' read -ra checks <<< "$CARGO_DENY_CHECKS"
          for raw_check in "${checks[@]}"; do
            check="${raw_check//[[:space:]]/}"
            if [ -n "$check" ]; then
              args+=("$check")
            fi
          done

          cargo deny --config "$CARGO_DENY_CONFIG" check "${args[@]}"
