# Builds and pushes a multi-arch image (amd64/arm64, GHCR by default) via docker-build-push.yml,
# tagged with the Git tag plus latest, after a Trivy scan of the first platform passes.
name: Publish Docker (compatibility alias)

on:
  workflow_call:
    inputs:
      image:
        description: 'Full image name (defaults to this repository in GHCR)'
        required: false
        type: string
        default: ''
      context:
        description: 'Build context'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Dockerfile path'
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: 'Target platforms'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      build-args:
        description: 'Build args as multiline KEY=VALUE entries'
        required: false
        type: string
        default: ''
      target:
        description: 'Optional Dockerfile target stage'
        required: false
        type: string
        default: ''
      labels:
        description: 'Apply OCI labels'
        required: false
        type: boolean
        default: true
      registry:
        description: 'Registry hostname'
        required: false
        type: string
        default: 'ghcr.io'
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/docker-build-push.yml
    with:
      image: ${{ inputs.image != '' && inputs.image || format('ghcr.io/{0}', github.repository) }}
      context: ${{ inputs.context }}
      dockerfile: ${{ inputs.dockerfile }}
      platforms: ${{ inputs.platforms }}
      tags: ${{ github.ref_type == 'tag' && format('{0},latest', github.ref_name) || format('{0},latest', github.sha) }}
      build-args: ${{ inputs.build-args }}
      target: ${{ inputs.target }}
      labels: ${{ inputs.labels }}
      registry: ${{ inputs.registry }}
      scan: true
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
