# Restores, builds and tests a .NET solution or project with the dotnet CLI, running dotnet test per
# target framework in a matrix; tests and a private NuGet token are optional.
name: .NET CI

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: 'Dotnet SDK version'
        type: string
        default: '8.0.x'
      frameworks:
        description: 'JSON array of target frameworks'
        type: string
        default: '["net8.0"]'
      test-project:
        description: 'Relative path to test project'
        type: string
        default: ''
      run-tests:
        description: 'Run tests'
        type: boolean
        default: true
    secrets:
      nuget-auth-token:
        description: 'Token for private NuGet feeds'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        framework: ${{ fromJSON(inputs.frameworks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          proj="${{ inputs.test-project }}"
          if [ -n "$proj" ] && [ ! -f "$proj" ]; then
            echo "test-project '$proj' not found" >&2
            exit 1
          fi
      - name: Restore
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.nuget-auth-token }}
        run: |
          set -euo pipefail
          dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        if: inputs.run-tests == true
        shell: bash
        run: |
          set -euo pipefail
          proj="${{ inputs.test-project }}"
          if [ -z "$proj" ]; then
            dotnet test --no-build -f ${{ matrix.framework }}
          else
            dotnet test "$proj" --no-build -f ${{ matrix.framework }}
          fi
