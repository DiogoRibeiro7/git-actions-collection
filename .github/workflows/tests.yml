name: Unit Tests

# Combined repository validation has moved to CI Tests.
# Retained as a manual diagnostic entry point so the focused suites can still
# be run independently when debugging CI failures.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Manual diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Explain canonical validation
        run: |
          echo "Combined repository validation has moved to CI Tests."
          echo "Use the CI Tests workflow for pull-request validation."
