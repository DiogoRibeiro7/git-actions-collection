# Runs pytest (or a custom test command) across a Python version and OS matrix, installing the
# project from pyproject.toml or requirements.txt with pip caching.
name: Python Test Matrix
on:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON array of Python versions'
        required: false
        type: string
        default: '["3.10","3.11","3.12"]'
      os-matrix:
        description: 'JSON array of OS labels'
        required: false
        type: string
        default: '["ubuntu-latest","windows-latest","macos-latest"]'
      test-command:
        description: 'Command to run tests; it runs in bash on every OS'
        required: false
        type: string
        default: 'pytest -q'
      pip-version:
        description: "pip release to install (set to 'latest' to track upstream)"
        required: false
        type: string
        default: '26.2.1'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJson(inputs.python-versions) }}
        os: ${{ fromJson(inputs.os-matrix) }}
    runs-on: ${{ matrix.os }}
    # Windows runners default to PowerShell; the steps below are bash on every OS.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project
        env:
          PIP_VERSION: ${{ inputs.pip-version }}
        run: |
          set -euo pipefail
          if [ "$PIP_VERSION" = "latest" ]; then
            python -m pip install --upgrade pip
          else
            python -m pip install --upgrade "pip==$PIP_VERSION"
          fi
          if [ -f pyproject.toml ]; then
            pip install .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest
      - name: Run tests
        run: ${{ inputs.test-command }}
