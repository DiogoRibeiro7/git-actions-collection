name: Python Test Matrix
on:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON array of Python versions'
        required: false
        type: string
        default: '["3.10","3.11","3.12"]'
      os-matrix:
        description: 'JSON array of OS labels'
        required: false
        type: string
        default: '["ubuntu-latest","windows-latest","macos-latest"]'
      test-command:
        description: 'Command to run tests'
        required: false
        type: string
        default: 'pytest -q'
      pip-version:
        description: "pip release to install (set to 'latest' to track upstream)"
        required: false
        type: string
        default: '24.3.1'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJson(inputs.python-versions) }}
        os: ${{ fromJson(inputs.os-matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@cfd55ca82492758d853442341ad4d8010466803a
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project
        run: |
          set -euo pipefail
          pip_version="${{ inputs.pip-version }}"
          if [ "$pip_version" = "latest" ]; then
            python -m pip install --upgrade pip
          else
            python -m pip install --upgrade "pip==$pip_version"
          fi
          if [ -f pyproject.toml ]; then
            pip install .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest
      - name: Run tests
        run: ${{ inputs.test-command }}
