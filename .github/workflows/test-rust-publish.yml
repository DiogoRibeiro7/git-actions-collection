name: Test Rust Publish Workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/rust-publish.yml'
      - '.github/workflows/test-rust-publish.yml'
      - 'examples/rust-crate/**'
      - 'tests/python/test_rust_publish_workflow.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-publish-dry-run:
    # GitHub checks nested job permissions before evaluating if:, so the
    # skipped live publish job's id-token grant must be allowed here. The
    # dry-run job itself still requests only contents: read.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/rust-publish.yml
    with:
      rust-toolchain: stable
      working-directory: examples/rust-crate
      package-name: rust-crate
      locked: false
      dry-run: true
