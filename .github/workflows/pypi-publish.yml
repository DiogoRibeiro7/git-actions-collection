name: Publish to PyPI
on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use for build/publish'
        required: false
        type: string
        default: '3.12'
      build-backend:
        description: 'build | poetry'
        required: false
        type: string
        default: 'build'
      environment:
        description: 'Deployment environment name (for protection rules)'
        required: false
        type: string
        default: 'pypi'
      pre-release:
        description: 'Publish as a pre-release (true/false)'
        required: false
        type: boolean
        default: false
      pip-version:
        description: "pip release to install (set to 'latest' to track upstream)"
        required: false
        type: string
        default: '24.3.1'
permissions:
  contents: read
  id-token: write  # OIDC for PyPI trusted publishing
jobs:
  publish:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Install build backend
        run: |
          set -euo pipefail
          pip_version="${{ inputs.pip-version }}"
          if [ "$pip_version" = "latest" ]; then
            python -m pip install --upgrade pip
          else
            python -m pip install --upgrade "pip==$pip_version"
          fi
          if [ "${{ inputs.build-backend }}" = "poetry" ]; then
            pip install poetry
          else
            pip install build twine
          fi
      - name: Build
        run: |
          if [ "${{ inputs.build-backend }}" = "poetry" ]; then
            poetry build
          else
            python -m build
          fi
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
          repository-url: ${{ inputs.pre-release && 'https://test.pypi.org/legacy/' || '' }}
