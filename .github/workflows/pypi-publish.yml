# Builds a Python package with python -m build or Poetry, validates it with twine check --strict,
# and publishes via PyPI trusted publishing, skipping existing versions.
name: Publish to PyPI
on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use for build/publish'
        required: false
        type: string
        default: '3.12'
      build-backend:
        description: 'build | poetry'
        required: false
        type: string
        default: 'build'
      working-directory:
        description: 'Directory containing the Python package'
        required: false
        type: string
        default: '.'
      environment:
        description: 'Deployment environment name (for protection rules)'
        required: false
        type: string
        default: 'pypi'
      pre-release:
        description: 'Upload to TestPyPI instead of PyPI; PyPI marks pre-releases from the version itself, e.g. 1.0.0rc1'
        required: false
        type: boolean
        default: false
      pip-version:
        description: "pip release to install (set to 'latest' to track upstream)"
        required: false
        type: string
        default: '26.2.1'
permissions:
  contents: read
  id-token: write  # OIDC for PyPI trusted publishing
jobs:
  publish:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Install build backend
        env:
          PIP_VERSION: ${{ inputs.pip-version }}
          BUILD_BACKEND: ${{ inputs.build-backend }}
        run: |
          set -euo pipefail
          if [ "$PIP_VERSION" = "latest" ]; then
            python -m pip install --upgrade pip
          else
            python -m pip install --upgrade "pip==$PIP_VERSION"
          fi
          if [ "$BUILD_BACKEND" = "poetry" ]; then
            pip install poetry twine
          else
            pip install build twine
          fi
      - name: Build
        env:
          BUILD_BACKEND: ${{ inputs.build-backend }}
        run: |
          set -euo pipefail
          if [ "$BUILD_BACKEND" = "poetry" ]; then
            poetry build
          else
            python -m build
          fi
      - name: Validate distribution metadata
        run: twine check --strict dist/*

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          # Actions do not inherit defaults.run.working-directory, so point at the built files.
          packages-dir: ${{ inputs.working-directory }}/dist
          skip-existing: true
          verbose: true
          print-hash: true
          repository-url: ${{ inputs.pre-release && 'https://test.pypi.org/legacy/' || '' }}
