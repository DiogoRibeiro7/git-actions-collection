# Deploys each Lambda in a JSON matrix via AWS OIDC when its path changed in the last commit,
# building per runtime, publishing a version and optionally moving an alias with rollback.
name: AWS Lambda Deploy

on:
  workflow_call:
    inputs:
      aws-role:
        description: "ARN of IAM role for deployment via OIDC"
        required: true
        type: string
      aws-region:
        description: "AWS region"
        required: false
        default: us-east-1
        type: string
      functions:
        description: "JSON array of function configs"
        required: true
        type: string
      pip-version:
        description: "pip release to install for Python runtimes (set to 'latest' to track upstream)"
        required: false
        default: '26.2.1'
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: ${{ fromJSON(inputs.functions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      # Step-level ./ actions resolve in the caller's checkout, so fetch this collection
      # at the exact commit of this reusable workflow to run its composite actions.
      - name: Check out collection actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .git-actions-collection
          persist-credentials: false
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ inputs.aws-role }}
          aws-region: ${{ inputs.aws-region }}
      - name: Detect changes
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          path="${{ matrix.function.path }}"
          if git diff --quiet HEAD^ -- "$path"; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Setup Python
        if: steps.changed.outputs.changed == 'true' && startsWith(matrix.function.runtime, 'python')
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.function.python-version || '3.12' }}
      - name: Build Python package
        if: steps.changed.outputs.changed == 'true' && startsWith(matrix.function.runtime, 'python')
        uses: ./.git-actions-collection/.github/actions/aws-lambda-build
        with:
          src: ${{ matrix.function.path }}
          output-zip: package.zip
          python-version: ${{ matrix.function.python-version || '3.12' }}
          pip-version: ${{ matrix.function.pip-version || inputs.pip-version }}
      - name: Setup Node.js
        if: steps.changed.outputs.changed == 'true' && startsWith(matrix.function.runtime, 'nodejs')
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.function.node-version || '24' }}
      - name: Build Node.js package
        if: steps.changed.outputs.changed == 'true' && startsWith(matrix.function.runtime, 'nodejs')
        working-directory: ${{ matrix.function.path }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --omit=dev
          zip -r "$GITHUB_WORKSPACE/package.zip" .
      - name: Setup .NET
        if: steps.changed.outputs.changed == 'true' && startsWith(matrix.function.runtime, 'dotnet')
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: ${{ matrix.function.dotnet-version || '8.0.x' }}
      - name: Build .NET package
        if: steps.changed.outputs.changed == 'true' && startsWith(matrix.function.runtime, 'dotnet')
        working-directory: ${{ matrix.function.path }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish -c Release -o build
          (cd build && zip -r "$GITHUB_WORKSPACE/package.zip" .)
      - name: Setup Go
        if: steps.changed.outputs.changed == 'true' && startsWith(matrix.function.runtime, 'go')
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ matrix.function.go-version || '1.22' }}
      - name: Build Go package
        if: steps.changed.outputs.changed == 'true' && startsWith(matrix.function.runtime, 'go')
        working-directory: ${{ matrix.function.path }}
        shell: bash
        run: |
          set -euo pipefail
          go build -o bootstrap
          zip -j "$GITHUB_WORKSPACE/package.zip" bootstrap
      - name: Setup Java
        if: steps.changed.outputs.changed == 'true' && startsWith(matrix.function.runtime, 'java')
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: ${{ matrix.function.java-version || '21' }}
      - name: Build Java package
        if: steps.changed.outputs.changed == 'true' && startsWith(matrix.function.runtime, 'java')
        working-directory: ${{ matrix.function.path }}
        shell: bash
        run: |
          set -euo pipefail
          mvn -q package
          # Lambda takes the application jar itself; zipping target/ nested the classes.
          jar="$(find target -maxdepth 1 -name '*.jar' ! -name 'original-*' | head -n1)"
          if [ -z "$jar" ]; then
            echo "::error::mvn package produced no jar in $PWD/target" >&2
            exit 1
          fi
          cp "$jar" "$GITHUB_WORKSPACE/package.zip"
      # Lambda applies configuration and code updates asynchronously, and a second update
      # while one is in progress fails with ResourceConflictException, so wait between them.
      - name: Update function configuration
        if: steps.changed.outputs.changed == 'true'
        shell: bash
        env:
          FUNCTION: ${{ matrix.function.name }}
          RUNTIME: ${{ matrix.function.runtime }}
          HANDLER: ${{ matrix.function.handler || '' }}
          ENVIRONMENT: ${{ matrix.function.env || '' }}
          LAYERS: ${{ matrix.function.layers || '' }}
          SUBNETS: ${{ matrix.function.subnet-ids || '' }}
          SECURITY_GROUPS: ${{ matrix.function.security-group-ids || '' }}
        run: |
          set -euo pipefail
          cmd=(aws lambda update-function-configuration --function-name "$FUNCTION")
          [ -n "$RUNTIME" ] && cmd+=(--runtime "$RUNTIME")
          [ -n "$HANDLER" ] && cmd+=(--handler "$HANDLER")
          # env is a JSON map; the CLI's shorthand Variables=... syntax cannot take JSON.
          [ -n "$ENVIRONMENT" ] && cmd+=(--environment "{\"Variables\":$ENVIRONMENT}")
          [ -n "$LAYERS" ] && cmd+=(--layers "$LAYERS")
          if [ -n "$SUBNETS" ] && [ -n "$SECURITY_GROUPS" ]; then
            cmd+=(--vpc-config "SubnetIds=$SUBNETS,SecurityGroupIds=$SECURITY_GROUPS")
          fi
          "${cmd[@]}"
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
      - name: Capture current alias
        if: steps.changed.outputs.changed == 'true' && matrix.function.alias != ''
        id: current
        shell: bash
        env:
          FUNCTION: ${{ matrix.function.name }}
          ALIAS: ${{ matrix.function.alias }}
        run: |
          set -euo pipefail
          prev=$(aws lambda get-alias --function-name "$FUNCTION" --name "$ALIAS" --query FunctionVersion --output text || echo '')
          echo "previous=$prev" >>"$GITHUB_OUTPUT"
      - name: Deploy function code
        if: steps.changed.outputs.changed == 'true'
        id: deploy
        shell: bash
        env:
          FUNCTION: ${{ matrix.function.name }}
          FUNCTION_PATH: ${{ matrix.function.path }}
          PACKAGE_TYPE: ${{ matrix.function.package-type || 'zip' }}
          IMAGE: ${{ matrix.function.image || '' }}
          S3_BUCKET: ${{ matrix.function.s3-bucket || '' }}
          ALIAS: ${{ matrix.function.alias || '' }}
        run: |
          set -euo pipefail
          pkg="$GITHUB_WORKSPACE/package.zip"
          if [ "$PACKAGE_TYPE" = "image" ]; then
            docker build -t "$IMAGE" "$FUNCTION_PATH"
            docker push "$IMAGE"
            aws lambda update-function-code --function-name "$FUNCTION" --image-uri "$IMAGE"
          else
            if [ ! -f "$pkg" ]; then
              echo "::error::No package.zip was built for $FUNCTION" >&2
              exit 1
            fi
            size=$(stat -c%s "$pkg")
            if [ "$size" -gt 52428800 ] && [ -n "$S3_BUCKET" ]; then
              key="$FUNCTION-$(date +%s).zip"
              aws s3 cp "$pkg" "s3://$S3_BUCKET/$key"
              aws lambda update-function-code --function-name "$FUNCTION" --s3-bucket "$S3_BUCKET" --s3-key "$key"
            else
              aws lambda update-function-code --function-name "$FUNCTION" --zip-file "fileb://$pkg"
            fi
          fi
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
          version=$(aws lambda publish-version --function-name "$FUNCTION" --output text --query Version)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if [ -n "$ALIAS" ]; then
            aws lambda update-alias --function-name "$FUNCTION" --name "$ALIAS" --function-version "$version"
          fi
      - name: Rollback on failure
        if: failure() && steps.current.outputs.previous != ''
        shell: bash
        env:
          FUNCTION: ${{ matrix.function.name }}
          ALIAS: ${{ matrix.function.alias }}
          PREVIOUS: ${{ steps.current.outputs.previous }}
        run: |
          set -euo pipefail
          aws lambda update-alias --function-name "$FUNCTION" --name "$ALIAS" --function-version "$PREVIOUS"
