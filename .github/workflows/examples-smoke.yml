# .github/workflows/examples-smoke.yml
name: Examples Smoke & Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: python-package
            type: python
          - example: npm-package
            type: node
          - example: java-app
            type: java
          - example: rust-crate
            type: rust
          - example: go-module
            type: go
          - example: infra
            type: terraform
          - example: docker-app
            type: docker
          - example: monorepo
            type: monorepo
          - example: k8s-manifests
            type: k8s
          - example: helm-chart
            type: helm

    steps:
      - uses: actions/checkout@v5
      - name: Install actionlint
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/rhysd/actionlint/releases/latest"
          url=$(python - <<'PY'
          import json
          import os
          import urllib.request

          api_url = os.environ["API_URL"]
          req = urllib.request.Request(api_url, headers={"Accept": "application/vnd.github+json"})
          token = os.environ.get("GITHUB_TOKEN")
          if token:
              req.add_header("Authorization", f"Bearer {token}")
          with urllib.request.urlopen(req, timeout=15) as resp:
              data = json.load(resp)
          for asset in data.get("assets", []):
              download_url = asset.get("browser_download_url", "")
              if download_url.endswith("linux_amd64.tar.gz"):
                  print(download_url)
                  break
          PY
          )
          if [ -z "$url" ]; then
            echo "actionlint linux_amd64 tarball not found in latest release." >&2
            exit 1
          fi
          curl -sSL "$url" | tar -xz
          sudo mv actionlint /usr/local/bin/
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_URL: https://api.github.com/repos/rhysd/actionlint/releases/latest

      - name: Lint example workflows
        run: |
          set -euo pipefail
          dir="examples/${{ matrix.example }}/.github/workflows"
          if [ -d "$dir" ]; then
            find "$dir" -type f \( -name '*.yml' -o -name '*.yaml' \) \
              -print0 | xargs -0 -r -n1 actionlint -ignore 'context "matrix" is not allowed here'
          fi

      - name: Setup Python
        if: matrix.type == 'python' || matrix.type == 'monorepo' || matrix.type == 'docker'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Node.js
        if: matrix.type == 'node' || matrix.type == 'monorepo'
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Java
        if: matrix.type == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        if: matrix.type == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Setup Rust
        if: matrix.type == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Terraform
        if: matrix.type == 'terraform' || matrix.type == 'monorepo'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest

      - name: Install Helm
        if: matrix.type == 'helm'
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Install kubeconform
        if: matrix.type == 'k8s'
        run: |
          set -euo pipefail
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz
          sudo mv kubeconform /usr/local/bin/

      - name: Python tests
        if: matrix.type == 'python'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          python -m pip install -q pytest pytest-cov
          python -m pytest

      - name: Node check
        if: matrix.type == 'node'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          node --version
          node --test

      - name: Java tests
        if: matrix.type == 'java'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          mvn -q -B -DskipTests=false test

      - name: Rust check
        if: matrix.type == 'rust'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          cargo test

      - name: Go test
        if: matrix.type == 'go'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          go test ./...

      - name: Terraform init
        if: matrix.type == 'terraform'
        run: |
          set -euo pipefail
          terraform -version
          terraform -chdir="examples/${{ matrix.example }}" init -backend=false
          terraform -chdir="examples/${{ matrix.example }}" validate

      - name: Ensure Docker
        if: matrix.type == 'docker'
        run: docker --version

      - name: Docker app tests
        if: matrix.type == 'docker'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          python -m pip install -q pytest pytest-cov
          python -m pytest

      - name: Docker build
        if: matrix.type == 'docker'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          docker build .

      - name: Monorepo lanes
        if: matrix.type == 'monorepo'
        run: |
          set -euo pipefail
          cd examples/monorepo/pkg-a
          python -m pip install -q ruff pytest pytest-cov
          ruff check .
          python -m pytest
          cd ../web-app
          node --version
          node --test
          cd ../infra
          terraform init -backend=false

      - name: Kubernetes manifests lint
        if: matrix.type == 'k8s'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          kubeconform -summary *.yaml

      - name: Helm lint and template
        if: matrix.type == 'helm'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          helm lint .
          helm template . --dry-run

  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Enforce canonical consumer references
        run: |
          set -euo pipefail
          if grep -RFn 'DiogoRibeiro7/gh-actions-collection/' examples scripts; then
            echo "Legacy repository references are forbidden." >&2
            exit 1
          fi
          if grep -REn 'DiogoRibeiro7/git-actions-collection/.+@main' examples scripts/pypi_trusted_publishing_wizard.py; then
            echo "Consumer examples must not use @main until the stable branch is synchronized." >&2
            exit 1
          fi
