# .github/workflows/examples-smoke.yml
name: Examples Smoke & Lint

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/**'
      - '.github/workflows/**'
      - 'examples/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'yarn.lock'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: python-package
            type: python
          - example: npm-package
            type: node
          - example: java-app
            type: java
          - example: rust-crate
            type: rust
          - example: rust-workspace
            type: rust
          - example: go-module
            type: go
          - example: infra
            type: terraform
          - example: docker-app
            type: docker
          - example: monorepo
            type: monorepo
          - example: k8s-manifests
            type: k8s
          - example: helm-chart
            type: helm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Python
        if: matrix.type == 'python' || matrix.type == 'monorepo' || matrix.type == 'docker'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Setup Node.js
        if: matrix.type == 'node' || matrix.type == 'monorepo'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Setup Java
        if: matrix.type == 'java'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        if: matrix.type == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.22.x'

      - name: Setup Rust
        if: matrix.type == 'rust'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - name: Setup Terraform
        if: matrix.type == 'terraform' || matrix.type == 'monorepo'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.16.4

      - name: Install Helm
        if: matrix.type == 'helm'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v4.3.0

      - name: Install kubeconform
        if: matrix.type == 'k8s'
        shell: bash
        env:
          VERSION: v0.8.0
          SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kubeconform.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/yannh/kubeconform/releases/download/$VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$SHA256  $archive" | sha256sum --check --quiet
          mkdir -p "$RUNNER_TEMP/kubeconform"
          tar -xzf "$archive" -C "$RUNNER_TEMP/kubeconform"
          echo "$RUNNER_TEMP/kubeconform" >> "$GITHUB_PATH"

      - name: Python tests
        if: matrix.type == 'python'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          python -m pip install -q pytest pytest-cov
          python -m pytest

      - name: Node check
        if: matrix.type == 'node'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          node --version
          node --test

      - name: Java tests
        if: matrix.type == 'java'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          mvn -q -B -DskipTests=false test

      - name: Rust check
        if: matrix.type == 'rust'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          cargo test

      - name: Go test
        if: matrix.type == 'go'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          go test ./...

      - name: Terraform init
        if: matrix.type == 'terraform'
        run: |
          set -euo pipefail
          terraform -version
          terraform -chdir="examples/${{ matrix.example }}" init -backend=false
          terraform -chdir="examples/${{ matrix.example }}" validate

      - name: Ensure Docker
        if: matrix.type == 'docker'
        run: docker --version

      - name: Docker app tests
        if: matrix.type == 'docker'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          python -m pip install -q pytest pytest-cov
          python -m pytest

      - name: Docker build
        if: matrix.type == 'docker'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          docker build .

      - name: Monorepo lanes
        if: matrix.type == 'monorepo'
        run: |
          set -euo pipefail
          cd examples/monorepo/pkg-a
          python -m pip install -q ruff pytest pytest-cov
          ruff check .
          python -m pytest
          cd ../web-app
          node --version
          node --test
          cd ../infra
          terraform init -backend=false

      - name: Kubernetes manifests lint
        if: matrix.type == 'k8s'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          kubeconform -summary ./*.yaml

      - name: Helm lint and template
        if: matrix.type == 'helm'
        run: |
          set -euo pipefail
          cd "examples/${{ matrix.example }}"
          helm lint .
          helm template . --dry-run=client

  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce repository reference contract
        run: |
          set -euo pipefail
          legacy="DiogoRibeiro7/"'gh-actions-collection'
          if git grep -n -F "$legacy" -- .; then
            echo "Legacy repository references are forbidden in tracked content." >&2
            exit 1
          fi
