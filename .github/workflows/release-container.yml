# Calls docker-build-push.yml (compatibility alias) to Trivy-scan and push a linux/amd64+arm64 image
# to ghcr.io/<owner>/<repo>, tagged with the Git tag plus latest, or with the commit SHA off a tag.
name: Release Container (compatibility alias)

on:
  workflow_call:
    inputs:
      target:
        description: 'Optional Dockerfile target stage'
        required: false
        type: string
        default: ''
      build-args:
        description: 'Build arguments as multiline KEY=VALUE entries'
        required: false
        type: string
        default: ''
    secrets:
      GHCR_USERNAME:
        description: 'Username for ghcr.io; defaults to the actor that triggered the run'
        required: false
      GHCR_TOKEN:
        description: 'Token that can push to ghcr.io; defaults to GITHUB_TOKEN, which needs packages: write from the caller'
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/docker-build-push.yml
    with:
      image: ${{ format('ghcr.io/{0}', github.repository) }}
      context: .
      dockerfile: Dockerfile
      platforms: linux/amd64,linux/arm64
      # latest moves only with a release tag; other refs push just the commit SHA.
      tags: ${{ github.ref_type == 'tag' && format('{0},latest', github.ref_name) || github.sha }}
      target: ${{ inputs.target }}
      build-args: ${{ inputs.build-args }}
      labels: true
      registry: ghcr.io
      scan: true
    secrets:
      REGISTRY_USERNAME: ${{ secrets.GHCR_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN }}
