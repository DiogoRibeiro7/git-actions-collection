# Calls docker-build-push.yml (compatibility alias) to push a linux/amd64+arm64 image to
# ghcr.io/<owner>/<repo>, tagged with the Git tag or SHA plus latest, and Trivy-scan it.
name: Release Container (compatibility alias)

on:
  workflow_call:
    secrets:
      GHCR_USERNAME:
        required: false
      GHCR_TOKEN:
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/docker-build-push.yml
    with:
      image: ${{ format('ghcr.io/{0}', github.repository) }}
      context: .
      dockerfile: Dockerfile
      platforms: linux/amd64,linux/arm64
      tags: ${{ github.ref_type == 'tag' && format('{0},latest', github.ref_name) || format('{0},latest', github.sha) }}
      target: prod
      build-args: |
        NODE_ENV=production
        API_URL=https://api.example.com
      labels: true
      registry: ghcr.io
      scan: true
    secrets:
      REGISTRY_USERNAME: ${{ secrets.GHCR_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN }}
