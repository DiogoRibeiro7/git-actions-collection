# Runs supported composite actions on a real runner against small consumer fixtures.
name: Test Composite Actions

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/**'
      - 'scripts/**'
      - 'tests/fixtures/composite-actions/**'
      - '.github/workflows/test-composite-actions.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Each job checks out only what an external caller gets (the actions and their
# bundled scripts) plus the fixtures, under collection/, and runs the action
# against a fixture copied to the workspace root. Files elsewhere in this
# repository therefore cannot hide what a consumer repository would lack.
jobs:
  setup-r:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the actions beside the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: collection
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/

      - name: Set up R and install a small package
        uses: ./collection/.github/actions/setup-r
        with:
          r-version: release
          packages: jsonlite

      - name: Verify R and the installed package
        run: |
          set -euo pipefail
          Rscript -e 'stopifnot(requireNamespace("jsonlite", quietly = TRUE))'

  setup-poetry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the actions beside the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: collection
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
            /tests/fixtures/composite-actions/

      - name: Prepare a Poetry project
        run: cp -R collection/tests/fixtures/composite-actions/poetry-project/. .

      - name: Set up Poetry and install the locked dependencies
        uses: ./collection/.github/actions/setup-poetry

      - name: Verify Poetry and the environment
        run: |
          set -euo pipefail
          poetry --version | grep -F "2.5.1"
          test "$POETRY_CACHE_DIR" = "$HOME/.cache/pypoetry"
          poetry run python -c "import importlib.metadata as m; assert m.version('packaging') == '26.3'"

  check-imports:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the actions beside the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: collection
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
            /tests/fixtures/composite-actions/

      - name: Prepare a project with declared and undeclared imports
        run: cp -R collection/tests/fixtures/composite-actions/check-imports/. .

      - name: Accept imports that pyproject.toml declares
        uses: ./collection/.github/actions/check-imports
        with:
          paths: src

      - name: Reject an import that pyproject.toml does not declare
        id: undeclared
        continue-on-error: true
        uses: ./collection/.github/actions/check-imports
        with:
          paths: undeclared

      - name: Verify the undeclared import failed the check
        env:
          OUTCOME: ${{ steps.undeclared.outcome }}
        run: test "$OUTCOME" = failure

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the actions beside the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: collection
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
            /tests/fixtures/composite-actions/

      - name: Prepare a benchmark suite
        run: cp -R collection/tests/fixtures/composite-actions/benchmark bench

      - name: Run the benchmarks
        uses: ./collection/.github/actions/benchmark-smoke
        with:
          working-directory: bench

      - name: Verify the benchmark report
        run: |
          python -c "import json; names = [b['name'] for b in json.load(open('bench/benchmark.json'))['benchmarks']]; assert names == ['test_fib'], names"

  aws-lambda-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the actions beside the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: collection
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
            /tests/fixtures/composite-actions/

      - name: Prepare a Lambda function with a dependency
        run: cp -R collection/tests/fixtures/composite-actions/lambda lambda

      - name: Package to the default path
        uses: ./collection/.github/actions/aws-lambda-build

      - name: Package into another directory
        uses: ./collection/.github/actions/aws-lambda-build
        with:
          output-zip: dist/function.zip

      - name: Verify both archives hold the handler and its dependency
        run: |
          set -euo pipefail
          for archive in artifact/lambda.zip dist/function.zip; do
            unzip -Z1 "$archive" > contents.txt
            grep -qx 'handler.py' contents.txt
            grep -qx 'packaging/__init__.py' contents.txt
          done

  setup-yarn:
    name: setup-yarn (Node ${{ matrix.node }}, ${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node.js 25 and newer no longer bundle Corepack, which the action installs.
        node: ['24', '26']
        project: [yarn-berry, yarn-classic]
    steps:
      - name: Check out the actions beside the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: collection
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
            /tests/fixtures/composite-actions/

      - name: Prepare a Yarn project in a subdirectory
        env:
          PROJECT: ${{ matrix.project }}
        run: cp -R "collection/tests/fixtures/composite-actions/$PROJECT" app

      - name: Install the locked dependencies
        uses: ./collection/.github/actions/setup-yarn
        with:
          node-version: ${{ matrix.node }}
          working-directory: app

      - name: Verify Node.js, Yarn and the installed dependency
        working-directory: app
        env:
          NODE_MAJOR: ${{ matrix.node }}
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          test "$(node -p 'process.versions.node.split(".")[0]')" = "$NODE_MAJOR"
          expected_yarn=4
          if [ "$PROJECT" = yarn-classic ]; then expected_yarn=1; fi
          test "$(yarn --version | cut -d. -f1)" = "$expected_yarn"
          node -e "require('is-number')"

      - name: Add a dependency the lockfile does not have
        working-directory: app
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            manifest.dependencies['is-odd'] = '3.0.1';
            fs.writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n');
          "

      - name: Install again with the stale lockfile
        id: stale
        continue-on-error: true
        uses: ./collection/.github/actions/setup-yarn
        with:
          node-version: ${{ matrix.node }}
          working-directory: app

      - name: Verify the stale lockfile failed the install
        env:
          OUTCOME: ${{ steps.stale.outcome }}
        run: test "$OUTCOME" = failure

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the actions beside the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: collection
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
            /tests/fixtures/composite-actions/

      # site/ keeps the fixture apart from the actions' own READMEs under collection/.
      - name: Prepare Markdown pages, one of them broken
        run: cp -R collection/tests/fixtures/composite-actions/markdown site

      - name: Lint several clean paths
        uses: ./collection/.github/actions/markdown-lint
        with:
          paths: site/docs site/README.md

      - name: Lint a clean and a broken path, one per line
        id: broken
        continue-on-error: true
        uses: ./collection/.github/actions/markdown-lint
        with:
          paths: |
            site/docs
            site/broken

      - name: Lint the broken path with a config file that allows it
        uses: ./collection/.github/actions/markdown-lint
        with:
          paths: site/broken
          config-file: site/relaxed.json

      - name: Lint a path that matches nothing
        id: unmatched
        continue-on-error: true
        uses: ./collection/.github/actions/markdown-lint
        with:
          paths: site/doc

      - name: Leave clean pages next to an installed dependency
        run: |
          set -euo pipefail
          rm -rf site/broken
          mkdir -p site/node_modules/some-package
          printf '#No space after the hash\n' > site/node_modules/some-package/README.md

      - name: Lint the directory without its dependencies
        uses: ./collection/.github/actions/markdown-lint
        with:
          paths: site

      - name: Verify the broken and unmatched paths failed
        env:
          BROKEN: ${{ steps.broken.outcome }}
          UNMATCHED: ${{ steps.unmatched.outcome }}
        run: |
          set -euo pipefail
          test "$BROKEN" = failure
          test "$UNMATCHED" = failure

  gradle-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the actions beside the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: collection
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
            /tests/fixtures/composite-actions/

      - name: Prepare a Java project
        run: cp -R collection/tests/fixtures/composite-actions/gradle-project app

      # Consumer projects commit their Gradle wrapper. Generate one from a verified
      # Gradle distribution instead of keeping a wrapper JAR in this repository.
      - name: Generate the Gradle wrapper
        working-directory: app
        env:
          VERSION: 9.8.0
          SHA256: bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gradle.zip"
          curl -fsSL -o "$archive" "https://services.gradle.org/distributions/gradle-$VERSION-bin.zip"
          echo "$SHA256  $archive" | sha256sum --check --quiet
          unzip -q "$archive" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-$VERSION/bin/gradle" wrapper --gradle-version "$VERSION" --no-daemon

      - name: Build with the default tasks
        uses: ./collection/.github/actions/gradle-build
        with:
          working-directory: app

      - name: Verify the jar holds the compiled class
        run: unzip -Z1 app/build/libs/app.jar | grep -qx 'example/Greeter.class'

      - name: Leave a file that only clean removes
        run: touch app/build/stale-marker

      - name: Run tasks listed one per line
        uses: ./collection/.github/actions/gradle-build
        with:
          working-directory: app
          tasks: |
            clean
            assemble

      - name: Verify both tasks ran
        run: |
          set -euo pipefail
          test ! -e app/build/stale-marker
          test -f app/build/libs/app.jar

      - name: Run a task the project does not have
        id: unknown
        continue-on-error: true
        uses: ./collection/.github/actions/gradle-build
        with:
          working-directory: app
          tasks: doesNotExist

      - name: Verify the unknown task failed the step
        env:
          OUTCOME: ${{ steps.unknown.outcome }}
        run: test "$OUTCOME" = failure

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the actions beside the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: collection
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
            /tests/fixtures/composite-actions/

      # The token is random and generated here, so the repository never holds a
      # secret-shaped string. It is masked so it cannot reach the job log either.
      - name: Prepare a clean folder and one with a leaked token
        run: |
          set -euo pipefail
          mkdir -p clean leaky
          echo "No credentials in this file." > clean/notes.txt
          token="ghp_$(python3 -c "import secrets, string; print(''.join(secrets.choice(string.ascii_letters + string.digits) for _ in range(36)))")"
          echo "::add-mask::$token"
          printf 'GITHUB_TOKEN=%s\n' "$token" > leaky/config.env

      - name: Scan the clean folder
        uses: ./collection/.github/actions/secret-scan
        with:
          args: --no-git -v --source clean

      - name: Scan the folder with the leaked token
        id: leaky
        continue-on-error: true
        uses: ./collection/.github/actions/secret-scan
        with:
          args: |
            --no-git
            --source leaky
            --report-format json
            --report-path report.json

      - name: Verify the leak failed the scan and stayed redacted
        env:
          OUTCOME: ${{ steps.leaky.outcome }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          python3 - <<'PY'
          import json
          findings = json.load(open("report.json"))
          assert [f["RuleID"] for f in findings] == ["github-pat"], findings
          assert all(f["Secret"] == "REDACTED" for f in findings), "secret not redacted"
          PY
          token="$(cut -d= -f2 leaky/config.env)"
          if grep -qF "$token" report.json; then
            echo "The report contains the token" >&2
            exit 1
          fi

  pr-template-enforcer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the actions beside the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: collection
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
            /tests/fixtures/composite-actions/

      # Each step passes `body`, so the result does not depend on the description
      # of whichever pull request triggered this run.
      - name: Accept a description with the default sections
        uses: ./collection/.github/actions/pr-template-enforcer
        with:
          body: |
            ## Summary
            Adds a feature.

            ## Testing
            Ran the test suite.

      - name: Reject a description without a Testing section
        id: missing
        continue-on-error: true
        uses: ./collection/.github/actions/pr-template-enforcer
        with:
          body: |
            ## Summary
            Adds a feature.

      # Whitespace rather than '' so the input is set and the default is not used.
      - name: Reject a blank description
        id: blank
        continue-on-error: true
        uses: ./collection/.github/actions/pr-template-enforcer
        with:
          body: '   '

      - name: Accept a description with the caller's own sections
        uses: ./collection/.github/actions/pr-template-enforcer
        with:
          body: |
            ## What
            Adds a feature.

            ## Why
            Users asked for it.
          required-sections: |
            ## What
            ## Why

      - name: Verify the incomplete and blank descriptions failed
        env:
          MISSING: ${{ steps.missing.outcome }}
          BLANK: ${{ steps.blank.outcome }}
        run: |
          set -euo pipefail
          test "$MISSING" = failure
          test "$BLANK" = failure

  apm-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the actions beside the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: collection
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/actions/
            /scripts/
            /tests/fixtures/composite-actions/

      # api-url points each provider at this stub instead of the real service.
      - name: Start a stub APM endpoint
        run: |
          set -euo pipefail
          python3 collection/tests/fixtures/composite-actions/apm-stub/server.py > stub.log 2>&1 &
          for _ in $(seq 1 50); do
            if curl -s -o /dev/null http://127.0.0.1:8080/; then exit 0; fi
            sleep 0.2
          done
          echo "The stub endpoint did not start" >&2
          cat stub.log >&2
          exit 1

      - name: Send a Datadog event with quotes in the environment
        uses: ./collection/.github/actions/apm-integration
        with:
          provider: datadog
          api-key: dd-test-key
          environment: staging "eu"
          deployment-id: build-7
          api-url: http://127.0.0.1:8080/api/v1/events

      - name: Send a New Relic deployment marker
        uses: ./collection/.github/actions/apm-integration
        with:
          provider: newrelic
          api-key: nr-test-key
          deployment-id: build-7
          api-url: http://127.0.0.1:8080/v2/applications/42/deployments.json

      - name: Write a latency file over its threshold
        run: |
          echo '{"latency": 120.5, "threshold": 100}' > metrics.json

      - name: Send the Application Insights event
        uses: ./collection/.github/actions/apm-integration
        with:
          provider: appinsights
          api-key: 00000000-0000-0000-0000-000000000000
          environment: staging
          deployment-id: build-7
          api-url: http://127.0.0.1:8080/v2/track
          metrics-file: metrics.json

      - name: Send to an endpoint that refuses the request
        id: refused
        continue-on-error: true
        uses: ./collection/.github/actions/apm-integration
        with:
          provider: datadog
          api-key: dd-test-key
          api-url: http://127.0.0.1:8080/reject

      - name: Verify what each provider received
        env:
          REFUSED: ${{ steps.refused.outcome }}
        run: |
          set -euo pipefail
          test "$REFUSED" = failure
          python3 - <<'PY'
          import json

          records = {}
          for line in open("requests.jsonl", encoding="utf-8"):
              record = json.loads(line)
              records.setdefault(record["path"], record)

          datadog = records["/api/v1/events"]
          assert datadog["headers"]["dd-api-key"] == "dd-test-key"
          event = json.loads(datadog["body"])
          assert event["title"] == "Deployment build-7", event
          assert event["tags"] == ['env:staging "eu"'], event

          newrelic = records["/v2/applications/42/deployments.json"]
          assert newrelic["headers"]["api-key"] == "nr-test-key"
          assert json.loads(newrelic["body"])["deployment"]["revision"] == "build-7"

          appinsights = json.loads(records["/v2/track"]["body"])
          assert appinsights["iKey"] == "00000000-0000-0000-0000-000000000000"
          assert appinsights["data"]["baseData"]["properties"] == {
              "deploymentId": "build-7",
              "environment": "staging",
          }, appinsights

          assert "/reject" in records
          PY
