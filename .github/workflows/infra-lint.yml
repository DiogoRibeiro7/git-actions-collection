name: Infra Lint
on:
  workflow_call:
    inputs:
        paths:
          description: 'Paths to check'
          required: false
          type: string
          default: '.'
permissions:
  contents: read
  security-events: write
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Terraform lint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --init
          tflint ${{ inputs.paths }} || true
      - name: CloudFormation lint
        run: |
          pip install cfn-lint
          cfn-lint -I ${{ inputs.paths }} || true
      - name: Checkov (optional)
        if: ${{ false }} # enable by editing to true
        uses: bridgecrewio/checkov-action@d146511ffb733a9a456c9ffc05cd462122037354
        with:
          directory: ${{ inputs.paths }}
          soft_fail: true
      - name: tfsec (optional)
        if: ${{ false }} # enable by editing to true
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6
        with:
          working_directory: ${{ inputs.paths }}
          soft_fail: true
      - name: KICS (optional)
        if: ${{ false }} # enable by editing to true
        uses: checkmarx/kics-github-action@76268ae575f4851bf64f7229f496a511c08f9de4
        with:
          path: ${{ inputs.paths }}
          fail_on: high
