name: CI Monorepo by Path

on:
  workflow_call:
    inputs:
      groups:
        description: >-
          JSON mapping top-level folders to reusable workflow paths.
          Example: {"pkg-a": ".github/workflows/python-lint.yml", "web-app": ".github/workflows/node-ci.yml"}
        required: true
        type: string

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Determine changed top-level paths
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.event.before }}"
          head_ref="${{ github.sha }}"
          if [ -z "${base_ref}" ] || [ "${base_ref}" = "0000000000000000000000000000000000000000" ]; then
            # first commit / new repository
            base_ref="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "Base: $base_ref"
          echo "Head: $head_ref"
          changed_paths="$(
            git diff --name-only "$base_ref" "$head_ref" \
              | awk -F/ '{print $1}' \
              | sort -u
          )"
          echo "Changed (top-level):"
          printf '%s\n' $changed_paths || true
          # export as space-separated single line
          echo "changed_paths=${changed_paths}" >> "$GITHUB_OUTPUT"

      - name: Build matrix
        id: set-matrix
        shell: bash
        env:
          GROUPS_JSON: ${{ inputs.groups }}
          CHANGED_TOP: ${{ steps.changed.outputs.changed_paths }}
        run: |
          python <<'PY'
          import json, os
          groups = json.loads(os.environ["GROUPS_JSON"])  # dict: top -> workflow path
          changed = os.environ.get("CHANGED_TOP","").split()
          include = []
          for top in changed:
              if top in groups:
                  include.append({"name": top, "workflow": groups[top]})
          matrix = {"include": include}
          # write outputs for GitHub
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps(matrix, separators=(',',':'))}\n")
              fh.write(f"count={len(include)}\n")
          PY

  run:
    needs: detect
    if: ${{ needs.detect.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Run workflow for changed group
        uses: ./${{ matrix.workflow }} # actionlint: allow=expression
