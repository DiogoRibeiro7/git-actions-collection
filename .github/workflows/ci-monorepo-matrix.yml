name: CI Monorepo by Path

on:
  workflow_call:
    inputs:
      groups:
        description: >
          JSON mapping top-level folders to a "kind" string the runner understands.
          Example: {"pkg-a":"python","web-app":"node","infra":"terraform"}
        required: true
        type: string

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - uses: actions/checkout@5
        with:
          fetch-depth: 0

      - name: Determine changed top-level paths
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.event.before }}"
          head_ref="${{ github.sha }}"
          if [ -z "${base_ref}" ] || [ "${base_ref}" = "0000000000000000000000000000000000000000" ]; then
            base_ref="$(git rev-list --max-parents=0 HEAD)"
          fi
          changed_paths="$(
            git diff --name-only "$base_ref" "$head_ref" \
              | awk -F/ 'NF>0{print $1}' | sort -u
          )"
          echo "changed_paths=${changed_paths}" >> "$GITHUB_OUTPUT"

      - name: Build matrix
        id: set-matrix
        shell: bash
        env:
          GROUPS_JSON: ${{ inputs.groups }}
          CHANGED_TOP: ${{ steps.changed.outputs.changed_paths }}
        run: |
          python <<'PY'
          import json, os
          groups = json.loads(os.environ["GROUPS_JSON"])  # {"top":"kind"}
          changed = os.environ.get("CHANGED_TOP","").split()
          include = []
          for top in changed:
              kind = groups.get(top)
              if kind:
                  include.append({"top": top, "kind": kind, "path": top})
          matrix = {"include": include}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps(matrix, separators=(',',':'))}\n")
              fh.write(f"count={len(include)}\n")
          PY

  run:
    needs: detect
    if: ${{ needs.detect.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: Run per-path CI
        uses: ./.github/workflows/ci-monorepo-runner.yml
        with:
          kind: ${{ matrix.kind }}
          working-directory: ${{ matrix.path }}
