# Detects top-level folders changed since the previous push and runs a basic per-folder check by
# kind (e.g. pytest, go test, cargo check, terraform init, docker build).
name: CI Monorepo by Path

on:
  workflow_call:
    inputs:
      groups:
        description: >
          JSON mapping top-level folders to a "kind" string the runner understands.
          Example: {"pkg-a":"python","web-app":"node","infra":"terraform"}
        required: true
        type: string

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # Pull requests compare with their base; pushes with the previous commit.
      - name: Determine changed top-level paths
        id: changed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_ref="$BASE_SHA"
          if [ -z "${base_ref}" ] || [ "${base_ref}" = "0000000000000000000000000000000000000000" ]; then
            base_ref="$(git rev-list --max-parents=0 HEAD | tail -n1)"
          fi
          # A step output is a single line unless it uses a delimiter, so join the paths with spaces.
          changed_paths="$(
            git diff --name-only "$base_ref" "$HEAD_SHA" \
              | awk -F/ 'NF>0{print $1}' | sort -u | tr '\n' ' '
          )"
          echo "changed_paths=${changed_paths}" >> "$GITHUB_OUTPUT"

      - name: Build matrix
        id: set-matrix
        shell: bash
        env:
          GROUPS_JSON: ${{ inputs.groups }}
          CHANGED_TOP: ${{ steps.changed.outputs.changed_paths }}
        run: |
          python <<'PY'
          import json, os
          groups = json.loads(os.environ["GROUPS_JSON"])  # {"top":"kind"}
          changed = os.environ.get("CHANGED_TOP","").split()
          include = []
          for top in changed:
              kind = groups.get(top)
              if kind:
                  include.append({"top": top, "kind": kind, "path": top})
          matrix = {"include": include}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps(matrix, separators=(',',':'))}\n")
              fh.write(f"count={len(include)}\n")
          PY

  run:
    needs: detect
    if: ${{ needs.detect.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    uses: ./.github/workflows/ci-monorepo-runner.yml
    with:
      kind: ${{ matrix.kind }}
      working-directory: ${{ matrix.path }}
