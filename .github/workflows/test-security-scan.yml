name: Test Security Scan Workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/security-scan.yml'
      - '.github/workflows/test-security-scan.yml'
      - 'tests/python/test_security_scan_workflow.py'
      - '.github/support-matrix.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  id-token: write
  attestations: write

jobs:
  smoke:
    uses: ./.github/workflows/security-scan.yml
    with:
      paths: tests/python/test_security_scan_workflow.py
      skip-python-scans: true
      skip-trivy: true
      skip-npm-signatures: true
      skip-java-verify: true
      skip-go-verify: true
