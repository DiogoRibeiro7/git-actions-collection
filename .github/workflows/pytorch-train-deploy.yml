name: PyTorch Train and Deploy

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.10'
      train-script:
        type: string
        default: 'train.py'
      benchmark-script:
        type: string
        default: 'benchmark.py'
      model-artifact:
        type: string
        default: 'model.pt'
      deploy:
        type: boolean
        default: false
      mlflow-uri:
        type: string
        default: ''
    secrets:
      hf-token:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  train:
    runs-on: ubuntu-latest
    container:
      image: pytorch/pytorch:2.1.2-cuda11.8-cudnn8-runtime
      options: --gpus all
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@cfd55ca82492758d853442341ad4d8010466803a
        with:
          python-version: ${{ inputs.python-version }}
      - name: Cache dependencies
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: |
            ~/.cache/pip
            data/
          key: ${{ runner.os }}-pytorch-${{ hashFiles('**/requirements.txt') }}
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt mlflow torch torchvision torchaudio
      - name: Train model
        run: |
          set -euo pipefail
          python "${{ inputs.train-script }}"
      - name: Track experiment with MLflow
        if: inputs.mlflow-uri != ''
        env:
          MLFLOW_TRACKING_URI: ${{ inputs.mlflow-uri }}
        run: |
          set -euo pipefail
          python -c "import mlflow, pathlib; mlflow.log_artifact(str(pathlib.Path('${{ inputs.model-artifact }}').resolve()))"
      - name: Benchmark model
        run: |
          set -euo pipefail
          python "${{ inputs.benchmark-script }}"
      - name: Upload model artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: trained-model
          path: ${{ inputs.model-artifact }}
      - name: Deploy model
        if: inputs.deploy
        env:
          HF_TOKEN: ${{ secrets.hf-token }}
        run: |
          set -euo pipefail
          echo "Deploying model with commit ${GITHUB_SHA}"

