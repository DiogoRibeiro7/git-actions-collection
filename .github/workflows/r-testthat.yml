name: R Tests (testthat)

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.R'
      - '**/tests/testthat/**'
      - '**/DESCRIPTION'
      - '.github/actions/r-testthat/**'
      - '.github/actions/setup-r/**'
      - '.github/workflows/r-testthat.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Run testthat suite
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Execute R tests
        uses: ./.github/actions/r-testthat
        with:
          test-directory: tests/testthat
          install-dependencies: true
          use-devtools: true
