name: Lockfile Consistency

on:
  workflow_call:
    inputs:
      pip-version:
        description: "pip release to install when validating Python lockfiles (set to 'latest' to track upstream)"
        required: false
        type: string
        default: '26.2.1'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check Poetry lock
        if: hashFiles('pyproject.toml') != '' && hashFiles('poetry.lock') != ''
        run: |
          set -euo pipefail
          pip_version="${{ inputs.pip-version }}"
          if [ "$pip_version" = "latest" ]; then
            python -m pip install --upgrade pip
          else
            python -m pip install --upgrade "pip==$pip_version"
          fi
          pip install poetry
          poetry lock --check
      - name: Check Yarn lock
        if: hashFiles('package.json') != '' && hashFiles('yarn.lock') != ''
        run: |
          # Node.js 25 and newer no longer bundle Corepack.
          if [ "$(node -p 'process.versions.node.split(".")[0]')" -ge 25 ]; then
            npm install --global corepack@0.36.0
          fi
          corepack enable
          yarn install --immutable
