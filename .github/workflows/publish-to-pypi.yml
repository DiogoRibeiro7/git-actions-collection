# Builds a package with python -m build, runs twine check --strict, and publishes to PyPI via
# trusted publishing (compatibility alias for pypi-publish.yml).
name: Publish to PyPI (compatibility alias)

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to build with'
        required: false
        type: string
        default: '3.12'
      pip-version:
        description: "pip release to install (set to 'latest' to track upstream)"
        required: false
        type: string
        default: '26.2.1'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/pypi-publish.yml
    with:
      python-version: ${{ inputs.python-version }}
      build-backend: build
      environment: pypi
      pre-release: false
      pip-version: ${{ inputs.pip-version }}
