# Installs dependencies with Yarn via Corepack (yarn install --immutable) and runs yarn lint and
# yarn test across an OS matrix (Ubuntu, Windows, macOS by default).
name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        required: false
        type: string
        default: '24'
      os-matrix:
        description: JSON array of OS labels
        required: false
        type: string
        default: '["ubuntu-latest","windows-latest","macos-latest"]'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os-matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn
      - name: Enable Corepack
        run: |
          # Node.js 25 and newer no longer bundle Corepack.
          if [ "$(node -p 'process.versions.node.split(".")[0]')" -ge 25 ]; then
            npm install --global corepack@0.36.0
          fi
          corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run lint
        run: yarn lint
      - name: Run tests
        run: yarn test
