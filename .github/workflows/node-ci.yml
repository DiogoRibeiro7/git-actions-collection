# Installs dependencies with npm, Yarn or pnpm from the lockfile and runs the package's lint and
# test scripts across an OS matrix (Ubuntu, Windows, macOS by default). The package manager is
# read from package.json's packageManager field or the lockfile unless package-manager names it.
# Each matrix entry summarizes its Node.js version, commands and their results on the run page.
name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        required: false
        type: string
        default: '24'
      os-matrix:
        description: JSON array of OS labels
        required: false
        type: string
        default: '["ubuntu-latest","windows-latest","macos-latest"]'
      package-manager:
        description: >-
          npm, yarn, pnpm, or auto to use package.json's packageManager field, then
          pnpm-lock.yaml or yarn.lock, then npm
        required: false
        type: string
        default: auto
      working-directory:
        description: Directory that holds package.json and the lockfile
        required: false
        type: string
        default: .

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os-matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # setup-node's `cache` input asks the runner's global Yarn or pnpm for its cache folder,
      # which fails in projects that pin another version through packageManager. Cache after Corepack.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        id: node
        with:
          node-version: ${{ inputs.node-version }}
      - name: Choose the package manager
        id: manager
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail
          manager="$PACKAGE_MANAGER"
          if [ "$manager" = auto ]; then
            manager="$(node -e 'const fs = require("fs"); const declared = fs.existsSync("package.json") && JSON.parse(fs.readFileSync("package.json", "utf8")).packageManager; process.stdout.write(typeof declared === "string" ? declared.split("@")[0] : "")')"
            if [ -z "$manager" ]; then
              if [ -f pnpm-lock.yaml ]; then
                manager=pnpm
              elif [ -f yarn.lock ]; then
                manager=yarn
              else
                manager=npm
              fi
            fi
          fi
          case "$manager" in
            npm) lockfile=package-lock.json ;;
            yarn) lockfile=yarn.lock ;;
            pnpm) lockfile=pnpm-lock.yaml ;;
            *)
              echo "::error title=Unsupported package manager::node-ci supports npm, yarn and pnpm, not '$manager'."
              exit 1
              ;;
          esac
          echo "Using $manager"
          echo "manager=$manager" >> "$GITHUB_OUTPUT"
          echo "lockfile=$lockfile" >> "$GITHUB_OUTPUT"
      - name: Enable Corepack
        if: steps.manager.outputs.manager != 'npm'
        env:
          MANAGER: ${{ steps.manager.outputs.manager }}
        run: |
          # Node.js 25 and newer no longer bundle Corepack, and the Corepack that Node.js 22
          # bundles cannot run current pnpm releases.
          if [ "$(node -p 'process.versions.node.split(".")[0]')" -ge 25 ] || [ "$MANAGER" = pnpm ]; then
            npm install --global corepack@0.36.0
          fi
          corepack enable
      - name: Locate the package cache
        id: cache
        env:
          MANAGER: ${{ steps.manager.outputs.manager }}
        run: |
          set -euo pipefail
          case "$MANAGER" in
            npm) dir="$(npm config get cache)" ;;
            pnpm) dir="$(pnpm store path)" ;;
            yarn)
              if [ "$(yarn --version | cut -d. -f1)" = "1" ]; then
                dir="$(yarn cache dir)"
              else
                dir="$(yarn config get cacheFolder)"
              fi
              ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Cache packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: ${{ steps.manager.outputs.manager }}-${{ runner.os }}-${{ hashFiles(format('**/{0}', steps.manager.outputs.lockfile)) }}
          restore-keys: |
            ${{ steps.manager.outputs.manager }}-${{ runner.os }}-
      - name: Install dependencies
        id: install
        env:
          MANAGER: ${{ steps.manager.outputs.manager }}
        run: |
          set -euo pipefail
          case "$MANAGER" in
            npm) command=(npm ci) ;;
            pnpm) command=(pnpm install --frozen-lockfile) ;;
            yarn)
              # Yarn 1 ignores --immutable, so it would rewrite an outdated lockfile.
              if [ "$(yarn --version | cut -d. -f1)" = "1" ]; then
                command=(yarn install --frozen-lockfile)
              else
                command=(yarn install --immutable)
              fi
              ;;
          esac
          echo "command=${command[*]}" >> "$GITHUB_OUTPUT"
          "${command[@]}"
      - name: Run lint
        id: lint
        env:
          MANAGER: ${{ steps.manager.outputs.manager }}
        run: '"$MANAGER" run lint'
      - name: Run tests
        id: tests
        env:
          MANAGER: ${{ steps.manager.outputs.manager }}
        run: '"$MANAGER" run test'

      # Adds this matrix entry's Node.js version, package manager, commands and their results to
      # the run page. It runs from the checkout, so a missing working-directory still gets a summary.
      - name: Summary
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          STEPS: ${{ toJSON(steps) }}
          NODE_VERSION: ${{ inputs.node-version }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          RUNNER_LABEL: ${{ matrix.os }}
        run: |
          # The summary is best effort: it must not fail a job that passed.
          node - <<'JS' || echo "::warning title=Node CI summary::Could not write the summary"
          const fs = require("fs");

          const OUTCOMES = {
            success: "✅ Passed",
            failure: "❌ Failed",
            cancelled: "Cancelled",
            skipped: "Skipped",
          };
          const env = process.env;
          const steps = JSON.parse(env.STEPS || "{}");
          const outputs = (id) => (steps[id] && steps[id].outputs) || {};
          const result = (id) => OUTCOMES[steps[id] && steps[id].outcome] || "Not run";
          const cell = (value) => String(value).split("|").join("\\|");
          const code = (value) => (value ? "`" + cell(value) + "`" : "—");

          const manager = outputs("manager").manager;
          const node = steps.node && steps.node.outcome === "success"
            ? process.version
            : `${env.NODE_VERSION} (not set up)`;
          const facts = [`Node.js ${node}`, `package manager ${manager || "not chosen"}`];
          if (env.WORKING_DIRECTORY && env.WORKING_DIRECTORY !== ".") {
            facts.push(`directory ${code(env.WORKING_DIRECTORY)}`);
          }

          const rows = [];
          if (!manager) {
            rows.push(["Package manager", code(`package-manager: ${env.PACKAGE_MANAGER}`), result("manager")]);
          }
          rows.push(["Install", code(outputs("install").command), result("install")]);
          rows.push(["Lint", code(manager && `${manager} run lint`), result("lint")]);
          rows.push(["Tests", code(manager && `${manager} run test`), result("tests")]);

          const summary = [
            `## Node CI on ${env.RUNNER_LABEL}`,
            "",
            facts.join(" · "),
            "",
            "| Step | Command | Result |",
            "| --- | --- | --- |",
            ...rows.map((row) => `| ${row.join(" | ")} |`),
            "",
          ].join("\n");
          fs.appendFileSync(env.GITHUB_STEP_SUMMARY, summary, "utf8");
          console.log(summary);
          JS
