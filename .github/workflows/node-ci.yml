# Installs dependencies with Yarn via Corepack (yarn install --immutable) and runs yarn lint and
# yarn test across an OS matrix (Ubuntu, Windows, macOS by default).
name: Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        required: false
        type: string
        default: '24'
      os-matrix:
        description: JSON array of OS labels
        required: false
        type: string
        default: '["ubuntu-latest","windows-latest","macos-latest"]'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os-matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # setup-node's `cache: yarn` asks the runner's global Yarn 1 for its cache folder,
      # which fails in projects that pin Yarn 2+ through packageManager. Cache after Corepack.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ inputs.node-version }}
      - name: Enable Corepack
        run: |
          # Node.js 25 and newer no longer bundle Corepack.
          if [ "$(node -p 'process.versions.node.split(".")[0]')" -ge 25 ]; then
            npm install --global corepack@0.36.0
          fi
          corepack enable
      - name: Locate the Yarn cache
        id: yarn-cache
        run: |
          set -euo pipefail
          if [ "$(yarn --version | cut -d. -f1)" = "1" ]; then
            dir="$(yarn cache dir)"
          else
            dir="$(yarn config get cacheFolder)"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Cache Yarn packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run lint
        run: yarn lint
      - name: Run tests
        run: yarn test
