name: Dependabot Policy

on:
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - "package.json"
      - "pyproject.toml"
      - "examples/**/package.json"
      - "examples/**/pyproject.toml"
      - "examples/**/Cargo.toml"
      - "examples/**/go.mod"
      - "examples/**/pom.xml"
      - "examples/**/deno.json"
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "tests/fixtures/**"
      - ".github/workflows/dependabot-policy.yml"
  push:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"
      - "package.json"
      - "pyproject.toml"
      - "examples/**/package.json"
      - "examples/**/pyproject.toml"
      - "examples/**/Cargo.toml"
      - "examples/**/go.mod"
      - "examples/**/pom.xml"
      - "examples/**/deno.json"
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "tests/fixtures/**"
      - ".github/workflows/dependabot-policy.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Dependabot policy
        uses: DiogoRibeiro7/safe-dependabot@v1
