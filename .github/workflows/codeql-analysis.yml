name: CodeQL Analysis

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript, go]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: github/codeql-action/init@ad2a4837011b42f6947b78d6417e7c253b1c504b
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@ad2a4837011b42f6947b78d6417e7c253b1c504b
        if: matrix.language != 'python'
      - uses: github/codeql-action/analyze@ad2a4837011b42f6947b78d6417e7c253b1c504b
        with:
          category: "/language:${{ matrix.language }}"
