name: CodeQL Analysis

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript, go]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: github/codeql-action/init@d8073367669608af8fbcc5f63dd0a0d52bb90cff
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        if: matrix.language != 'python'
      - uses: github/codeql-action/analyze@d8073367669608af8fbcc5f63dd0a0d52bb90cff
        with:
          category: "/language:${{ matrix.language }}"
