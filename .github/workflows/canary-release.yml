# Publishes pre-release builds from main or -rc refs: Python to TestPyPI, npm under the next dist-
# tag, or a multi-arch Docker image tagged rc.
name: Canary Release

on:
  workflow_call:
    inputs:
      project-type:
        description: 'Project type: python, npm, or docker'
        required: true
        type: string
      working-directory:
        description: 'Directory containing project files'
        required: false
        type: string
        default: '.'
      build-backend:
        description: 'Python build backend'
        required: false
        type: string
        default: 'poetry'
      image:
        description: 'Docker image name'
        required: false
        type: string
        default: ''
    secrets:
      NPM_TOKEN:
        required: false
permissions:
  contents: read

jobs:
  python:
    if: inputs.project-type == 'python' && (github.ref == 'refs/heads/main' || contains(github.ref_name, '-rc'))
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/pypi-publish.yml
    with:
      build-backend: ${{ inputs.build-backend }}
      environment: testpypi
      pre-release: true
      working-directory: ${{ inputs.working-directory }}

  npm:
    if: inputs.project-type == 'npm' && (github.ref == 'refs/heads/main' || contains(github.ref_name, '-rc'))
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      working-directory: ${{ inputs.working-directory }}
      tag: next
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    if: inputs.project-type == 'docker' && (github.ref == 'refs/heads/main' || contains(github.ref_name, '-rc'))
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/docker-build-push.yml
    with:
      image: ${{ inputs.image != '' && inputs.image || format('ghcr.io/{0}', github.repository) }}
      context: ${{ inputs.working-directory }}
      tags: rc
      platforms: linux/amd64,linux/arm64
