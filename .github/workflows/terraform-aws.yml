name: Terraform Apply (AWS OIDC)

on:
  workflow_call:
    inputs:
      aws-role:
        description: "ARN of the AWS IAM role to assume via OIDC"
        required: true
        type: string
      aws-region:
        description: "AWS region for operations"
        required: false
        type: string
        default: us-east-1
      terraform-version:
        description: "Terraform version"
        required: false
        type: string
        default: latest
      working-directory:
        description: "Directory containing Terraform configuration"
        required: false
        type: string
        default: .
      apply:
        description: "Apply the plan after planning"
        required: false
        type: boolean
        default: false
      destroy-on-failure:
        description: "Destroy resources if apply fails"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ inputs.terraform-version }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@49f33fe638c0cba4fb16037a27915a7ab7740259
        with:
          role-to-assume: ${{ inputs.aws-role }}
          aws-region: ${{ inputs.aws-region }}
      - name: Terraform Init
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..3}; do
            if terraform init -input=false; then
              break
            elif [ "$attempt" -lt 3 ]; then
              echo "Init failed (attempt $attempt), retrying..." >&2
              sleep 5
            else
              echo "Init failed after 3 attempts" >&2
              exit 1
            fi
          done
      - name: Terraform Plan
        id: plan
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..3}; do
            if terraform plan -input=false -no-color -out=tfplan | tee plan.log; then
              break
            elif [ "$attempt" -lt 3 ]; then
              echo "Plan failed (attempt $attempt), retrying..." >&2
              sleep 5
            else
              echo "Plan failed after 3 attempts" >&2
              exit 1
            fi
          done
      - name: Terraform Apply
        if: inputs.apply == true
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..3}; do
            if terraform apply -input=false -auto-approve tfplan; then
              break
            elif [ "$attempt" -lt 3 ]; then
              echo "Apply failed (attempt $attempt), retrying..." >&2
              sleep 5
            else
              echo "Apply failed after 3 attempts" >&2
              exit 1
            fi
          done
      - name: Rollback on failure
        if: failure() && inputs.destroy-on-failure == true && inputs.apply == true
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Apply failed; attempting rollback" >&2
          terraform destroy -auto-approve
