name: Docker Build & Push
on:
  workflow_call:
    inputs:
      image:
        description: 'Registry image name (e.g., ghcr.io/org/app)'
        required: true
        type: string
      context:
        description: 'Build context'
        required: false
        type: string
        default: '.'
      dockerfile:
        description: 'Dockerfile path'
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: 'Target platforms'
        required: false
        type: string
        default: 'linux/amd64'
      tags:
        description: 'Comma-separated list of tags'
        required: false
        type: string
        default: 'latest'
      aws-region:
        description: 'AWS region for ECR (optional)'
        required: false
        type: string
        default: 'us-east-1'
      aws-role:
        description: 'AWS IAM role to assume for ECR push (optional)'
        required: false
        type: string
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.image }}" in
            (*[!a-z0-9./-]*) echo "Invalid image name" >&2; exit 1 ;;
          esac
      - name: Set up QEMU
        if: inputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Configure AWS credentials
        if: inputs.aws-role != ''
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ inputs.aws-role }}
          aws-region: ${{ inputs.aws-region }}
      - name: Login to Amazon ECR
        if: inputs.aws-role != ''
        uses: aws-actions/amazon-ecr-login@2fc7aceee09e9e4a7105c0d060c656fad0b4f63d
      - name: Login to GHCR (fallback to custom registry creds)
        if: inputs.aws-role == ''
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Build & Push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.image }}:${{ inputs.tags }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4
        with:
          image-ref: ${{ inputs.image }}:${{ inputs.tags }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
