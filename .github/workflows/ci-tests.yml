name: CI Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow syntax and shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.0'
          cache: false
      - name: Install actionlint and ShellCheck
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Lint repository workflows
        run: actionlint -pyflakes=

  python-tests:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run pytest
        run: python -m pytest -q
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: python-coverage
          path: |
            htmlcov/**
            coverage.xml
          if-no-files-found: ignore

  bash-tests:
    name: Bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: Run bats
        run: bats --recursive tests/bash

  js-tests:
    name: JavaScript and TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Type check
        run: yarn typecheck
      - name: Run Vitest
        run: yarn test
      - name: Audit repository JavaScript dependencies
        run: yarn audit
      - name: Validate and audit the npm example
        working-directory: examples/npm-package
        run: |
          corepack yarn install --immutable
          corepack yarn lint
          corepack yarn test
          corepack yarn npm audit --all --recursive

  python-audit:
    name: Python dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and capture repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip freeze --all --exclude-editable > "$RUNNER_TEMP/repository-requirements.txt"
          python scripts/security_requirements.py > "$RUNNER_TEMP/action-requirements.txt"
      - name: Install isolated auditor
        run: |
          python -m venv "$RUNNER_TEMP/audit-tools"
          "$RUNNER_TEMP/audit-tools/bin/python" -m pip install pip-audit==2.10.1
      - name: Audit resolved repository dependencies
        run: |
          "$RUNNER_TEMP/audit-tools/bin/pip-audit" --strict --no-deps --disable-pip \
            -r "$RUNNER_TEMP/repository-requirements.txt"
      - name: Audit action and workflow tool dependencies
        run: |
          "$RUNNER_TEMP/audit-tools/bin/pip-audit" --strict -r "$RUNNER_TEMP/action-requirements.txt"
      - name: Audit Django example dependencies
        run: |
          "$RUNNER_TEMP/audit-tools/bin/pip-audit" --strict -r examples/django-app/requirements.txt

  composite-smoke:
    name: Composite action (apply=${{ matrix.apply }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        apply: ['false', 'true']
    steps:
      # Keep the collection outside the consumer's root so bundled-helper
      # resolution is exercised exactly as it is for an external caller.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: collection
      - name: Prepare consumer fixture
        run: cp collection/tests/fixtures/action-consumer/* .
      - name: Update fixture dependencies
        id: update
        uses: ./collection/.github/actions/smart-dependency-update
        with:
          manifests: package.json
          apply: ${{ matrix.apply }}
      - name: Verify public output and consumer manifest
        env:
          REPORT: ${{ steps.update.outputs.report }}
          APPLY: ${{ matrix.apply }}
        run: python collection/tests/integration/assert_dependency_update.py
      - name: Reject empty manifests
        id: invalid
        continue-on-error: true
        uses: ./collection/.github/actions/smart-dependency-update
        with:
          manifests: ''
      - name: Verify failure propagation
        if: always()
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: test "$OUTCOME" = failure
