# Runs deno lint and deno test across an OS matrix with dependency caching, and optionally deploys
# to Deno Deploy production with deployctl once every OS has passed.
name: Deno CI

on:
  workflow_call:
    inputs:
      deno-version:
        description: Deno version
        required: false
        type: string
        default: '1.x'
      os-matrix:
        description: JSON array of OS labels
        required: false
        type: string
        default: '["ubuntu-latest","windows-latest","macos-latest"]'
      run-tests:
        description: Run tests
        required: false
        type: boolean
        default: true
      deploy:
        description: Deploy to Deno Deploy
        required: false
        type: boolean
        default: false
      project:
        description: Deno Deploy project name
        required: false
        type: string
    secrets:
      deno-deploy-token:
        description: Token for Deno Deploy
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os-matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: ${{ inputs.deno-version }}
      - name: Cache Deno dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cache/deno
            ~/Library/Caches/deno
            %LOCALAPPDATA%\\deno\\cache
          key: deno-${{ runner.os }}-${{ hashFiles('**/deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-
      - name: Lint
        run: deno lint
      - name: Test
        if: inputs.run-tests == true
        run: deno test

  # Deploy once, after every OS passed; deploying from the matrix pushed to production once per OS.
  deploy:
    needs: build
    if: inputs.deploy == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: ${{ inputs.deno-version }}
      - name: Deploy
        shell: bash
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.deno-deploy-token }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          if [ -z "$PROJECT" ]; then
            echo 'project is required when deploy is true' >&2
            exit 1
          fi
          if [ -z "$DENO_DEPLOY_TOKEN" ]; then
            echo 'deno-deploy-token secret is required when deploy is true' >&2
            exit 1
          fi
          deno run --allow-read --allow-net --allow-env https://deno.land/x/deploy@1.9.1/deployctl.ts \
            deploy --project="$PROJECT" --prod
