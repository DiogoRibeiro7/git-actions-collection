# Regenerates CHANGELOG.md from full git history with git-cliff and opens or updates a pull request
# with the result via peter-evans/create-pull-request.
name: Changelog Auto PR
on:
  workflow_call:
    inputs:
      commit-message:
        description: 'Commit message and pull request title'
        required: false
        type: string
        default: 'chore: update changelog'
      branch:
        description: 'Branch the changelog update is pushed to'
        required: false
        type: string
        default: 'chore/update-changelog'
permissions:
  contents: write
  pull-requests: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # Ubuntu does not package git-cliff; install a checksum-verified release binary.
      - name: Install git-cliff
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5
        with:
          tool: git-cliff@2.14.2
      - name: Generate changelog
        run: git cliff --output CHANGELOG.md
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          commit-message: ${{ inputs.commit-message }}
          title: ${{ inputs.commit-message }}
          body: 'Update changelog'
          branch: ${{ inputs.branch }}
