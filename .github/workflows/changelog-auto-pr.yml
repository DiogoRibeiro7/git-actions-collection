# Regenerates CHANGELOG.md from full git history with git-cliff and opens or updates a pull request
# with the result via peter-evans/create-pull-request.
name: Changelog Auto PR
on:
  workflow_call:
    inputs:
      commit-message:
        required: false
        type: string
        default: 'chore: update changelog'
      branch:
        required: false
        type: string
        default: 'chore/update-changelog'
permissions:
  contents: write
  pull-requests: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install git-cliff
        run: |
          sudo apt-get update
          sudo apt-get install -y git-cliff
      - name: Generate changelog
        run: git cliff --output CHANGELOG.md
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          commit-message: ${{ inputs.commit-message }}
          title: ${{ inputs.commit-message }}
          body: 'Update changelog'
          branch: ${{ inputs.branch }}
