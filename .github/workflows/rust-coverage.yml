# Generates workspace LCOV coverage with cargo-llvm-cov, summarizes totals and the least covered
# files on the run page, uploads lcov.info as an artifact, and optionally fails below a minimum
# line-coverage percentage.
name: Rust Coverage

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: Rust toolchain used for coverage instrumentation
        type: string
        default: stable
      working-directory:
        description: Directory containing Cargo.toml
        type: string
        default: .
      locked:
        description: Require Cargo.lock to remain unchanged
        type: boolean
        default: true
      features:
        description: Comma-separated Cargo features to enable
        type: string
        default: ''
      all-features:
        description: Enable all Cargo features
        type: boolean
        default: false
      no-default-features:
        description: Disable default Cargo features
        type: boolean
        default: false
      minimum-line-coverage:
        description: Minimum total line coverage percentage; 0 disables the threshold
        type: number
        default: 0
      upload-lcov:
        description: Upload lcov.info as a workflow artifact
        type: boolean
        default: true
      artifact-retention-days:
        description: Number of days to retain the LCOV artifact
        type: number
        default: 7
      use-cache:
        description: Restore and save a best-effort Cargo dependency/build cache
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  coverage:
    name: Rust coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: llvm-tools-preview

      - name: Restore Rust cache
        if: inputs.use-cache
        continue-on-error: true
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: ${{ inputs.working-directory }} -> target
          cache-targets: true
          cache-on-failure: false

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Validate coverage configuration
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          CARGO_ALL_FEATURES: ${{ inputs.all-features }}
          CARGO_NO_DEFAULT_FEATURES: ${{ inputs.no-default-features }}
          CARGO_FEATURES: ${{ inputs.features }}
          MINIMUM_LINE_COVERAGE: ${{ inputs.minimum-line-coverage }}
          ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact-retention-days }}
        run: |
          set -euo pipefail

          if [ ! -f Cargo.toml ]; then
            echo "Cargo.toml not found in ${{ inputs.working-directory }}" >&2
            exit 1
          fi

          if [[ "$CARGO_ALL_FEATURES" == "true" && "$CARGO_NO_DEFAULT_FEATURES" == "true" ]]; then
            echo "all-features and no-default-features cannot both be enabled" >&2
            exit 1
          fi

          if [[ "$CARGO_ALL_FEATURES" == "true" && -n "$CARGO_FEATURES" ]]; then
            echo "all-features cannot be combined with an explicit feature list" >&2
            exit 1
          fi

          python - "$MINIMUM_LINE_COVERAGE" "$ARTIFACT_RETENTION_DAYS" <<'PY'
          import sys

          minimum = float(sys.argv[1])
          retention = int(float(sys.argv[2]))

          if not 0 <= minimum <= 100:
              raise SystemExit("minimum-line-coverage must be between 0 and 100")
          if not 1 <= retention <= 90:
              raise SystemExit("artifact-retention-days must be between 1 and 90")
          PY

      - name: Generate LCOV coverage
        id: coverage
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          CARGO_LOCKED: ${{ inputs.locked }}
          CARGO_ALL_FEATURES: ${{ inputs.all-features }}
          CARGO_NO_DEFAULT_FEATURES: ${{ inputs.no-default-features }}
          CARGO_FEATURES: ${{ inputs.features }}
          MINIMUM_LINE_COVERAGE: ${{ inputs.minimum-line-coverage }}
        run: |
          set -euo pipefail
          args=(--workspace)
          [[ "$CARGO_LOCKED" == "true" ]] && args+=(--locked)
          [[ "$CARGO_ALL_FEATURES" == "true" ]] && args+=(--all-features)
          [[ "$CARGO_NO_DEFAULT_FEATURES" == "true" ]] && args+=(--no-default-features)
          [[ -n "$CARGO_FEATURES" ]] && args+=(--features "$CARGO_FEATURES")
          [[ "$MINIMUM_LINE_COVERAGE" != "0" ]] && args+=(--fail-under-lines "$MINIMUM_LINE_COVERAGE")

          cargo llvm-cov "${args[@]}" --lcov --output-path lcov.info

      # Writes totals and the least covered files to the run page from lcov.info, the same data
      # the artifact holds, then prints cargo-llvm-cov's own per-file report to the log.
      - name: Coverage summary
        if: always()
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          OUTCOME: ${{ steps.coverage.outcome }}
          MINIMUM_LINE_COVERAGE: ${{ inputs.minimum-line-coverage }}
        run: |
          set -euo pipefail
          # The summary is best effort: it must not fail a job that passed.
          python - <<'PY' || echo "::warning title=Coverage summary::Could not write the summary"
          import os

          OUTCOMES = {
              "success": "✅ Passed",
              "failure": "❌ Failed",
              "cancelled": "Cancelled",
              "skipped": "Skipped",
          }
          workspace = os.environ.get("GITHUB_WORKSPACE") or os.getcwd()
          minimum = float(os.environ.get("MINIMUM_LINE_COVERAGE") or 0)


          def percent(hit, total):
              return f"{100 * hit / total:.2f}%" if total else "n/a"


          files, record = [], {}
          try:
              with open("lcov.info", encoding="utf-8") as handle:
                  for line in handle:
                      key, _, value = line.strip().partition(":")
                      if key == "SF":
                          record = {"path": os.path.relpath(os.path.abspath(value), workspace)}
                      elif key in ("LF", "LH", "FNF", "FNH"):
                          record[key] = int(value)
                      elif key == "end_of_record" and record:
                          files.append(record)
                          record = {}
          except OSError:
              files = None

          total = {key: sum(item.get(key, 0) for item in files or []) for key in ("LF", "LH", "FNF", "FNH")}
          lines = percent(total["LH"], total["LF"])
          detail = "no coverage report" if files is None else f"{lines} of lines"
          if minimum:
              detail += f" (minimum {minimum:g}%)"
          result = OUTCOMES.get(os.environ.get("OUTCOME"), "Not run")
          out = ["## Rust coverage", "", "| Check | Result |", "| --- | --- |", f"| Coverage | {result}: {detail} |"]
          if files is not None:
              out += [
                  "",
                  "| Metric | Covered | Total | Coverage |",
                  "| --- | ---: | ---: | ---: |",
                  f"| Lines | {total['LH']} | {total['LF']} | {lines} |",
                  f"| Functions | {total['FNH']} | {total['FNF']} | {percent(total['FNH'], total['FNF'])} |",
              ]
              partial = sorted(
                  (item["LH"] / item["LF"], item["path"], item["LH"], item["LF"])
                  for item in files
                  if item.get("LF") and item.get("LH", 0) < item["LF"]
              )
              if partial:
                  out += ["", "**Least covered files**", "", "| File | Lines | Coverage |", "| --- | ---: | ---: |"]
                  out += [f"| `{path}` | {hit}/{found} | {percent(hit, found)} |" for _, path, hit, found in partial[:10]]
          summary = "\n".join(out) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          print(summary)
          if files is not None and minimum and total["LF"] and 100 * total["LH"] / total["LF"] < minimum:
              print(f"::error title=Line coverage::Line coverage is {lines}, below the minimum of {minimum:g}%.")
          PY
          if [ -f lcov.info ]; then
            cargo llvm-cov report --summary-only
          else
            echo "Coverage report was not generated." >&2
          fi

      - name: Upload LCOV report
        if: inputs.upload-lcov && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rust-lcov
          path: ${{ inputs.working-directory }}/lcov.info
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact-retention-days }}
