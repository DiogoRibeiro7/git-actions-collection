name: Test Rust CI Workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/rust-ci.yml'
      - '.github/workflows/test-rust-ci.yml'
      - 'examples/rust-crate/**'
      - 'tests/python/test_rust_ci_workflow.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-example:
    uses: ./.github/workflows/rust-ci.yml
    with:
      rust-toolchain: stable
      working-directory: examples/rust-crate
      locked: false
      features: extra
      run-compatibility: true
      compatibility-toolchains: '["stable"]'
      compatibility-os: '["ubuntu-latest"]'
