# Checks GitHub Actions workflow syntax, expressions, and inline shell scripts in the caller repository.
name: Workflow Lint

on:
  workflow_call:
    inputs:
      extra-workflow-files:
        description: >-
          Git pathspecs, one per line, for workflow files outside `.github/workflows`
          to lint as well, such as examples or templates
          (for example `examples/**/.github/workflows/*.yml`). A pathspec list that
          matches no tracked file fails the check. Empty lints only `.github/workflows`.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  lint:
    name: Workflow syntax and shell lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.0'
          cache: false

      - name: Install actionlint and ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint caller workflows
        shell: bash
        run: |
          set -euo pipefail
          actionlint -pyflakes=

      - name: Lint extra workflow files
        if: ${{ !cancelled() && inputs.extra-workflow-files != '' }}
        shell: bash
        env:
          EXTRA_WORKFLOW_FILES: ${{ inputs.extra-workflow-files }}
        run: |
          set -euo pipefail
          mapfile -t pathspecs < <(
            printf '%s\n' "$EXTRA_WORKFLOW_FILES" |
              sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d'
          )
          if [ "${#pathspecs[@]}" -eq 0 ]; then
            echo "extra-workflow-files lists no pathspecs; nothing else to lint."
            exit 0
          fi
          mapfile -d '' -t files < <(git ls-files -z -- "${pathspecs[@]}")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::extra-workflow-files matched no tracked files: ${pathspecs[*]}"
            exit 1
          fi
          echo "Linting ${#files[@]} extra workflow files."
          actionlint -pyflakes= "${files[@]}"
