# Checks GitHub Actions workflow syntax, expressions, and inline shell scripts in the caller repository.
name: Workflow Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Workflow syntax and shell lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.0'
          cache: false

      - name: Install actionlint and ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint caller workflows
        shell: bash
        run: |
          set -euo pipefail
          actionlint -pyflakes=
