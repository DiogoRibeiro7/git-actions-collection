# Runs GitHub's dependency-review-action with default settings on pull requests and merge queues,
# failing on dependency changes that introduce known vulnerabilities; other events skip the review.
name: Dependency Review

on:
  workflow_call:

permissions:
  contents: read

jobs:
  review:
    # The action needs a base and head commit, which only these events provide; elsewhere it errors.
    if: contains(fromJson('["pull_request","pull_request_target","merge_group"]'), github.event_name)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
