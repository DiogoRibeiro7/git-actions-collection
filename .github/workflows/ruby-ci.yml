name: Ruby CI

on:
  workflow_call:
    inputs:
      ruby-versions:
        description: 'JSON array of Ruby versions'
        type: string
        default: '["3.1","3.2"]'
      test-command:
        description: 'Command to run tests'
        type: string
        default: 'bundle exec rake test'
      run-tests:
        description: 'Run tests'
        type: boolean
        default: true
    secrets:
      rubygems-token:
        description: 'Token for private gem sources'
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        ruby: ${{ fromJSON(inputs.ruby-versions) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Ruby
        uses: ruby/setup-ruby@ab177d40ee5483edb974554986f56b33477e21d0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
        env:
          BUNDLE_RUBYGEMS__PKG__DEV: ${{ secrets.rubygems-token }}
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f Gemfile ]; then
            echo 'Gemfile not found' >&2
            exit 1
          fi
          cmd="${{ inputs.test-command }}"
          if [ -z "$cmd" ]; then
            echo 'test-command cannot be empty' >&2
            exit 1
          fi
      - name: Run tests
        if: inputs.run-tests == true
        run: ${{ inputs.test-command }}
