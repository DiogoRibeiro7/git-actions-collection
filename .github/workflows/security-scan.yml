# Runs pip-audit and Bandit (SARIF uploaded to code scanning), opt-in Trivy filesystem scanning, and
# npm signature, Maven/Gradle and Go module checks when detected, lists each result and its findings
# on the run page, then attests reports with SLSA provenance.
name: Security Scan
on:
  workflow_call:
    inputs:
      paths:
        description: 'Paths (globs) to scan'
        required: false
        type: string
        default: "."
      skip-python-scans:
        description: 'Skip pip-audit and Bandit scans'
        required: false
        type: boolean
        default: false
      dependency-install-command:
        description: 'Optional shell command that installs the project dependencies; pip-audit then audits what it installed. Without it, the root requirements.txt, or else the dependencies of pyproject.toml, are audited'
        required: false
        type: string
        default: ''
      bandit-args:
        description: 'Additional Bandit CLI arguments'
        required: false
        type: string
        default: '-ll -ii'
      skip-trivy:
        description: 'Skip Trivy filesystem scan'
        required: false
        type: boolean
        default: true
      pip-version:
        description: "pip release to install for Python scanners (set to 'latest' to track upstream)"
        required: false
        type: string
        default: '26.2.1'
      skip-npm-signatures:
        description: 'Skip npm package signature verification'
        required: false
        type: boolean
        default: false
      skip-java-verify:
        description: 'Skip Maven/Gradle dependency verification'
        required: false
        type: boolean
        default: false
      skip-go-verify:
        description: 'Skip Go module verification'
        required: false
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  security:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    env:
      PIP_AUDIT_CACHE_DIR: ~/.cache/pip-audit
      TRIVY_CACHE_DIR: ~/.cache/trivy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - name: Cache pip-audit DB
        if: ${{ inputs['skip-python-scans'] == false }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.PIP_AUDIT_CACHE_DIR }}
          key: pip-audit-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
      - name: Cache Trivy DB
        if: ${{ inputs['skip-trivy'] == false }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-${{ runner.os }}
      # pip-audit without a target audits its own environment, not the project, so
      # always hand it a requirements file: the caller's installed packages, the
      # root requirements.txt, or the dependencies pyproject.toml resolves to.
      - name: Prepare Python dependency audit target
        id: audit-target
        if: ${{ inputs['skip-python-scans'] == false }}
        shell: bash
        env:
          DEPENDENCY_INSTALL_COMMAND: ${{ inputs.dependency-install-command }}
          PIP_VERSION: ${{ inputs.pip-version }}
        run: |
          set -euo pipefail
          if [ "$PIP_VERSION" = "latest" ]; then
            python -m pip install --upgrade pip
          else
            python -m pip install --upgrade "pip==$PIP_VERSION"
          fi

          requirements=""
          if [ -n "$DEPENDENCY_INSTALL_COMMAND" ]; then
            bash -euo pipefail -c "$DEPENDENCY_INSTALL_COMMAND"
            python -m pip freeze --exclude-editable \
              | grep -vEi '^(pip|setuptools|wheel)==' \
              > .security-scan-audit-requirements.txt || true
            requirements=.security-scan-audit-requirements.txt
          elif [ -f requirements.txt ]; then
            requirements=requirements.txt
          elif [ -f pyproject.toml ]; then
            python -m venv "$RUNNER_TEMP/security-scan-project"
            if "$RUNNER_TEMP/security-scan-project/bin/python" -m pip install --quiet .; then
              "$RUNNER_TEMP/security-scan-project/bin/python" -m pip freeze --exclude-editable \
                | grep -vEi '^(pip|setuptools|wheel)==' \
                | grep -v ' @ file://' \
                > .security-scan-audit-requirements.txt || true
              requirements=.security-scan-audit-requirements.txt
            else
              echo "::warning::pip-audit skipped: installing the project from pyproject.toml failed. Set dependency-install-command to install it."
            fi
          else
            echo "::warning::pip-audit skipped: no requirements.txt or pyproject.toml. Set dependency-install-command to audit installed dependencies."
          fi
          echo "requirements=$requirements" >> "$GITHUB_OUTPUT"

      # Outside the workspace, so Bandit never scans the scanners' own packages.
      - name: Install Python scanners
        if: ${{ inputs['skip-python-scans'] == false }}
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/security-scan-tools"
          "$RUNNER_TEMP/security-scan-tools/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/security-scan-tools/bin/python" -m pip install pip-audit==2.10.1 bandit==1.8.6

      - name: Python dependency scans
        id: python-scans
        if: ${{ inputs['skip-python-scans'] == false }}
        shell: bash
        env:
          SCAN_PATHS: ${{ inputs.paths }}
          BANDIT_ARGS: ${{ inputs.bandit-args }}
          AUDIT_REQUIREMENTS: ${{ steps.audit-target.outputs.requirements }}
        run: |
          set -uo pipefail
          if [ -n "$AUDIT_REQUIREMENTS" ] && [ -s "$AUDIT_REQUIREMENTS" ]; then
            "$RUNNER_TEMP/security-scan-tools/bin/pip-audit" --strict --format json -o pip-audit.json \
              --requirement "$AUDIT_REQUIREMENTS" > pip-audit.log 2>&1
            audit_status=$?
          else
            echo "No Python dependencies to audit." | tee pip-audit.log
            echo '{"dependencies": [], "fixes": []}' > pip-audit.json
            audit_status=0
          fi

          read -r -a bandit_args <<< "$BANDIT_ARGS"
          "$RUNNER_TEMP/security-scan-tools/bin/bandit" -r "$SCAN_PATHS" "${bandit_args[@]}" -f json -o bandit.json > bandit.log 2>&1
          bandit_status=$?

          echo "pip-audit-status=$audit_status" >> "$GITHUB_OUTPUT"
          echo "bandit-status=$bandit_status" >> "$GITHUB_OUTPUT"

      - name: Convert Python scanner reports to SARIF
        if: ${{ inputs['skip-python-scans'] == false && always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def sarif(tool, rules, results):
              return {
                  "version": "2.1.0",
                  "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                  "runs": [{
                      "tool": {"driver": {"name": tool, "rules": rules}},
                      "results": results,
                  }],
              }

          audit_rules = {}
          audit_results = []
          audit_path = Path("pip-audit.json")
          if audit_path.exists():
              data = json.loads(audit_path.read_text(encoding="utf-8"))
              for dep in data.get("dependencies", []):
                  name = dep.get("name", "unknown")
                  version = dep.get("version", "unknown")
                  for vuln in dep.get("vulns", []):
                      rule_id = vuln.get("id", "pip-audit")
                      audit_rules.setdefault(rule_id, {
                          "id": rule_id,
                          "name": rule_id,
                          "shortDescription": {"text": "Vulnerable Python dependency"},
                      })
                      audit_results.append({
                          "ruleId": rule_id,
                          "level": "error",
                          "message": {"text": f"{name} {version}: {vuln.get('description', rule_id)}"},
                      })
          Path("pip-audit.sarif").write_text(
              json.dumps(sarif("pip-audit", list(audit_rules.values()), audit_results), indent=2),
              encoding="utf-8",
          )

          bandit_rules = {}
          bandit_results = []
          bandit_path = Path("bandit.json")
          if bandit_path.exists():
              data = json.loads(bandit_path.read_text(encoding="utf-8"))
              for finding in data.get("results", []):
                  rule_id = finding.get("test_id", "bandit")
                  bandit_rules.setdefault(rule_id, {
                      "id": rule_id,
                      "name": rule_id,
                      "shortDescription": {"text": finding.get("test_name", "Bandit finding")},
                  })
                  severity = finding.get("issue_severity", "LOW").lower()
                  level = {"high": "error", "medium": "warning"}.get(severity, "note")
                  result = {
                      "ruleId": rule_id,
                      "level": level,
                      "message": {"text": finding.get("issue_text", rule_id)},
                  }
                  filename = finding.get("filename")
                  line = finding.get("line_number")
                  if filename and line:
                      result["locations"] = [{
                          "physicalLocation": {
                              "artifactLocation": {"uri": filename},
                              "region": {"startLine": int(line)},
                          }
                      }]
                  bandit_results.append(result)
          Path("bandit.sarif").write_text(
              json.dumps(sarif("Bandit", list(bandit_rules.values()), bandit_results), indent=2),
              encoding="utf-8",
          )
          PY
      - name: Trivy (optional)
        id: trivy
        if: ${{ inputs['skip-trivy'] == false }}
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: fs
          scanners: vuln,secret,config
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: '1'
          path: ${{ inputs.paths }}
      - name: Set up Node (if needed)
        if: hashFiles('package-lock.json') != '' && inputs['skip-npm-signatures'] == false
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Verify npm signatures
        id: npm-signatures
        if: hashFiles('package-lock.json') != '' && inputs['skip-npm-signatures'] == false
        run: |
          set -euo pipefail
          npm audit signatures
      - name: Set up Java (if needed)
        if: (hashFiles('pom.xml') != '' || hashFiles('build.gradle') != '' || hashFiles('build.gradle.kts') != '') && inputs['skip-java-verify'] == false
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Maven dependencies
        id: maven
        if: hashFiles('pom.xml') != '' && inputs['skip-java-verify'] == false
        run: |
          set -euo pipefail
          mvn -B -q -e -DskipTests verify
      # --write-verification-metadata regenerates the checksums instead of checking them.
      # Verification happens when Gradle resolves dependencies against the committed file.
      - name: Verify Gradle dependencies
        id: gradle
        if: (hashFiles('build.gradle') != '' || hashFiles('build.gradle.kts') != '') && inputs['skip-java-verify'] == false
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradle/verification-metadata.xml ]; then
            echo "::warning::Gradle dependency verification skipped: gradle/verification-metadata.xml is missing. Generate it with ./gradlew --write-verification-metadata sha256 and commit it."
            exit 0
          fi
          ./gradlew --no-daemon --dependency-verification strict dependencies
      - name: Set up Go (if needed)
        if: hashFiles('go.sum') != '' && inputs['skip-go-verify'] == false
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.22'
      - name: Verify Go modules
        id: go-modules
        if: hashFiles('go.sum') != '' && inputs['skip-go-verify'] == false
        run: |
          set -euo pipefail
          go mod verify
      - name: Generate audit log
        if: ${{ always() }}
        run: |
          set -euo pipefail
          {
            echo "workflow: $GITHUB_WORKFLOW"
            echo "run-id: $GITHUB_RUN_ID"
            echo "repository: $GITHUB_REPOSITORY"
            echo "commit: $GITHUB_SHA"
            echo "timestamp: $(date -u +%FT%TZ)"
          } > audit.log
      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: security-reports
          path: |
            pip-audit.sarif
            bandit.sarif
            pip-audit.json
            bandit.json
            trivy.sarif
            pip-audit.log
            bandit.log
            audit.log
          if-no-files-found: ignore
      - name: Upload pip-audit report
        if: ${{ inputs['skip-python-scans'] == false && always() }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: pip-audit.sarif
      - name: Upload Bandit report
        if: ${{ inputs['skip-python-scans'] == false && always() }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: bandit.sarif
      - name: Upload Trivy report
        if: ${{ inputs['skip-trivy'] == false && always() }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          sarif_file: trivy.sarif

      # Lists every scanner that applied, with its findings, on the run page. Locations stay in
      # code scanning, which already receives the SARIF reports.
      - name: Summary
        if: ${{ always() }}
        shell: bash
        env:
          STEPS: ${{ toJSON(steps) }}
          SKIP_PYTHON: ${{ inputs.skip-python-scans }}
          SKIP_TRIVY: ${{ inputs.skip-trivy }}
          SKIP_NPM: ${{ inputs.skip-npm-signatures }}
          SKIP_JAVA: ${{ inputs.skip-java-verify }}
          SKIP_GO: ${{ inputs.skip-go-verify }}
        run: |
          # The summary is best effort: it must not fail a job that passed.
          python - <<'PY' || echo "::warning title=Security summary::Could not write the summary"
          import json
          import os
          from pathlib import Path

          OUTCOMES = {
              "success": "✅ Passed",
              "failure": "❌ Failed",
              "cancelled": "Cancelled",
              "skipped": "Skipped",
          }
          steps = json.loads(os.environ.get("STEPS") or "{}")
          ARTIFACT = "see the security-reports artifact"


          def enabled(name):
              return os.environ.get(f"SKIP_{name}") != "true"


          def load(path, default):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8", errors="replace"))
              except (OSError, ValueError):
                  return default


          def cell(value):
              return " ".join(str(value).split()).replace("|", "\\|")


          def plural(count, noun):
              return f"{count} {noun}{'' if count == 1 else 's'}"


          def outcome(step_id, detail=""):
              text = OUTCOMES.get((steps.get(step_id) or {}).get("outcome"), "Not run")
              return f"{text}: {detail}" if detail else text


          rows, sections = [], []
          if enabled("PYTHON"):
              scans = (steps.get("python-scans") or {}).get("outputs") or {}
              # pip-audit reports an advisory once per source, so count each ID once.
              audit = load("pip-audit.json", {})
              advisories, packages = {}, set()
              for dependency in audit.get("dependencies") or []:
                  for vuln in dependency.get("vulns") or []:
                      key = (dependency.get("name"), vuln.get("id"))
                      advisories.setdefault(key, (dependency, vuln))
                      packages.add(dependency.get("name"))
              status = scans.get("pip-audit-status")
              audited = sum(1 for item in audit.get("dependencies") or [] if not item.get("skip_reason"))
              if status is None:
                  result = "Not run"
              elif status == "0":
                  result = f"✅ Passed: {plural(audited, 'package')} audited" if audited else "✅ Passed: nothing to audit"
              elif advisories:
                  found = f"{len(advisories)} {'advisory' if len(advisories) == 1 else 'advisories'}"
                  result = f"❌ Failed: {found} in {plural(len(packages), 'package')}"
              else:
                  result = f"❌ Failed: exit {status}, {ARTIFACT}"
              rows.append(("pip-audit", result))
              if advisories:
                  table = ["**pip-audit findings**", "", "| Package | Version | Advisory | Fixed in |", "| --- | --- | --- | --- |"]
                  for (name, advisory_id), (dependency, vuln) in list(advisories.items())[:50]:
                      cves = [alias for alias in vuln.get("aliases") or [] if alias.startswith("CVE-")]
                      advisory = f"[{advisory_id}](https://osv.dev/vulnerability/{advisory_id})"
                      if cves:
                          advisory += f" ({cves[0]})"
                      fixed = ", ".join(f"`{version}`" for version in vuln.get("fix_versions") or []) or "none"
                      table.append(f"| `{name}` | {dependency.get('version')} | {advisory} | {fixed} |")
                  sections.append(table)

              bandit = load("bandit.json", {})
              findings = bandit.get("results") or []
              status = scans.get("bandit-status")
              severities = [item.get("issue_severity", "").lower() for item in findings]
              counts = ", ".join(f"{severities.count(level)} {level}" for level in ("high", "medium", "low") if level in severities)
              if status is None:
                  result = "Not run"
              elif status == "0":
                  result = "✅ Passed"
              elif findings:
                  result = f"❌ Failed: {counts}"
              else:
                  result = f"❌ Failed: exit {status}, {ARTIFACT}"
              if bandit.get("errors"):
                  result += f" ({plural(len(bandit['errors']), 'file')} could not be scanned)"
              rows.append(("Bandit", result))
              if findings:
                  table = ["**Bandit findings**", "", "| Severity | Test | Location | Issue |", "| --- | --- | --- | --- |"]
                  for item in findings[:50]:
                      test = f"[{item.get('test_id')}]({item['more_info']})" if item.get("more_info") else item.get("test_id")
                      where = f"`{str(item.get('filename', '')).removeprefix('./')}:{item.get('line_number')}`"
                      table.append(f"| {item.get('issue_severity')} | {test} {item.get('test_name', '')} | {where} | {cell(item.get('issue_text', ''))} |")
                  sections.append(table)

          if enabled("TRIVY"):
              runs = load("trivy.sarif", {}).get("runs") or []
              results = [result for run in runs for result in run.get("results") or []]
              rules = {rule.get("id"): rule for run in runs for rule in (run.get("tool") or {}).get("driver", {}).get("rules") or []}
              rows.append(("Trivy", outcome("trivy", plural(len(results), "finding") if results else "")))
              if results:
                  table = ["**Trivy findings**", "", "| Rule | Level | Location | Description |", "| --- | --- | --- | --- |"]
                  for result in results[:50]:
                      rule = rules.get(result.get("ruleId")) or {}
                      text = (rule.get("shortDescription") or {}).get("text") or (result.get("message") or {}).get("text", "")
                      physical = ((result.get("locations") or [{}])[0].get("physicalLocation") or {})
                      uri = (physical.get("artifactLocation") or {}).get("uri", "")
                      line = (physical.get("region") or {}).get("startLine")
                      where = f"`{uri}:{line}`" if uri and line else (f"`{uri}`" if uri else "")
                      table.append(f"| {result.get('ruleId')} | {result.get('level', '')} | {where} | {cell(text.splitlines()[0] if text else '')} |")
                  sections.append(table)

          if enabled("NPM") and Path("package-lock.json").is_file():
              rows.append(("npm signatures", outcome("npm-signatures")))
          if enabled("JAVA") and Path("pom.xml").is_file():
              rows.append(("Maven dependencies", outcome("maven")))
          if enabled("JAVA") and (Path("build.gradle").is_file() or Path("build.gradle.kts").is_file()):
              if Path("gradle/verification-metadata.xml").is_file():
                  rows.append(("Gradle dependencies", outcome("gradle")))
              else:
                  rows.append(("Gradle dependencies", "⚠️ Not verified: no gradle/verification-metadata.xml"))
          if enabled("GO") and Path("go.sum").is_file():
              rows.append(("Go modules", outcome("go-modules")))

          out = ["## Security scan", "", "| Check | Result |", "| --- | --- |"]
          out += [f"| {name} | {result} |" for name, result in rows] or ["| (none) | Every scanner is disabled |"]
          for section in sections:
              out += ["", *section]
          summary = "\n".join(out) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          print(summary)
          PY

      - name: Fail on Python scanner findings
        if: ${{ inputs['skip-python-scans'] == false && always() }}
        shell: bash
        env:
          PIP_AUDIT_STATUS: ${{ steps.python-scans.outputs.pip-audit-status }}
          BANDIT_STATUS: ${{ steps.python-scans.outputs.bandit-status }}
        run: |
          set -euo pipefail
          if [ "$PIP_AUDIT_STATUS" != "0" ] || [ "$BANDIT_STATUS" != "0" ]; then
            echo "Python security scan failed: pip-audit=$PIP_AUDIT_STATUS bandit=$BANDIT_STATUS" >&2
            exit 1
          fi

  provenance:
    name: Generate provenance
    needs: security
    if: ${{ always() && needs.security.result != 'cancelled' }}
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Download security reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: security-reports
          path: security-reports

      - name: Generate SLSA provenance
        id: slsa
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: security-reports/**

      - name: Upload SLSA bundle
        if: ${{ steps.slsa.outputs.bundle-path != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: security-attestation
          path: ${{ steps.slsa.outputs.bundle-path }}
