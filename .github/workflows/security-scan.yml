name: Security Scan
on:
  workflow_call:
    inputs:
      paths:
        description: 'Paths (globs) to scan'
        required: false
        type: string
        default: "."
      skip-trivy:
        description: 'Skip Trivy filesystem scan'
        required: false
        type: boolean
        default: true
      pip-version:
        description: "pip release to install for Python scanners (set to 'latest' to track upstream)"
        required: false
        type: string
        default: '24.3.1'
permissions:
  contents: read
  security-events: write
  id-token: write
  attestations: write
jobs:
  security:
    runs-on: ubuntu-latest
    env:
      PIP_AUDIT_CACHE_DIR: ~/.cache/pip-audit
      TRIVY_CACHE_DIR: ~/.cache/trivy
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Cache pip-audit DB
        uses: actions/cache@638ed79f9dc94c1de1baef91bcab5edaa19451f4
        with:
          path: ${{ env.PIP_AUDIT_CACHE_DIR }}
          key: pip-audit-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
      - name: Cache Trivy DB
        if: ${{ inputs['skip-trivy'] == false }}
        uses: actions/cache@638ed79f9dc94c1de1baef91bcab5edaa19451f4
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-${{ runner.os }}
      - name: Python dependency scans
        run: |
          set -euo pipefail
          pip_version="${{ inputs.pip-version }}"
          if [ "$pip_version" = "latest" ]; then
            python -m pip install --upgrade pip
          else
            python -m pip install --upgrade "pip==$pip_version"
          fi
          pip install pip-audit==2.9.0 bandit==1.8.6
          (pip-audit --strict --format sarif -o pip-audit.sarif 2>&1 | tee pip-audit.log) &
          pid1=$!
          (bandit -r "${{ inputs.paths }}" -ll -ii -f sarif -o bandit.sarif 2>&1 | tee bandit.log) &
          pid2=$!
          wait "$pid1" "$pid2"
      - name: Trivy (optional)
        if: ${{ inputs['skip-trivy'] == false }}
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
        with:
          scan-type: fs
          scanners: vuln,secret,config
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: '1'
          path: ${{ inputs.paths }}
      - name: Set up Node (if needed)
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
      - name: Verify npm signatures
        if: hashFiles('package-lock.json') != ''
        run: |
          set -euo pipefail
          npm audit signatures
      - name: Set up Java (if needed)
        if: hashFiles('pom.xml') != '' || hashFiles('build.gradle') != '' || hashFiles('build.gradle.kts') != ''
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Maven dependencies
        if: hashFiles('pom.xml') != ''
        run: |
          set -euo pipefail
          mvn -B -q -e -DskipTests verify
      - name: Verify Gradle dependencies
        if: hashFiles('build.gradle') != '' || hashFiles('build.gradle.kts') != ''
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --write-verification-metadata sha256
      - name: Set up Go (if needed)
        if: hashFiles('go.sum') != ''
        uses: actions/setup-go@1d76b952eb9246b03e20e15a9ef98c6d4af389ef
        with:
          go-version: '1.22'
      - name: Verify Go modules
        if: hashFiles('go.sum') != ''
        run: |
          set -euo pipefail
          go mod verify
      - name: Generate audit log
        if: ${{ always() }}
        run: |
          set -euo pipefail
          {
            echo "workflow: $GITHUB_WORKFLOW"
            echo "run-id: $GITHUB_RUN_ID"
            echo "repository: $GITHUB_REPOSITORY"
            echo "commit: $GITHUB_SHA"
            echo "timestamp: $(date -u +%FT%TZ)"
          } > audit.log
      - name: Generate SLSA provenance
        if: ${{ always() }}
        id: slsa
        continue-on-error: true
        uses: actions/attest-build-provenance@0b6e9809265278d02c58acf52849a95818a5a306
        with:
          subject-path: |
            pip-audit.sarif
            bandit.sarif
            trivy.sarif
            pip-audit.log
            bandit.log
            audit.log
      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-reports
          path: |
            pip-audit.sarif
            bandit.sarif
            trivy.sarif
            pip-audit.log
            bandit.log
            audit.log
          if-no-files-found: ignore
      - name: Upload SLSA bundle
        if: ${{ steps.slsa.outputs.bundle-path != '' && always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-attestation
          path: ${{ steps.slsa.outputs.bundle-path }}
      - name: Upload pip-audit report
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@ad2a4837011b42f6947b78d6417e7c253b1c504b
        with:
          sarif_file: pip-audit.sarif
      - name: Upload Bandit report
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@ad2a4837011b42f6947b78d6417e7c253b1c504b
        with:
          sarif_file: bandit.sarif
      - name: Upload Trivy report
        if: ${{ inputs['skip-trivy'] == false && always() }}
        uses: github/codeql-action/upload-sarif@ad2a4837011b42f6947b78d6417e7c253b1c504b
        with:
          sarif_file: trivy.sarif
