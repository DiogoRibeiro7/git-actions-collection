name: Security Scan
on:
  workflow_call:
    inputs:
      paths:
        description: 'Paths (globs) to scan'
        required: false
        type: string
        default: "."
      skip-python-scans:
        description: 'Skip pip-audit and Bandit scans'
        required: false
        type: boolean
        default: false
      dependency-install-command:
        description: 'Optional shell command that installs the consumer project dependencies before pip-audit'
        required: false
        type: string
        default: ''
      skip-trivy:
        description: 'Skip Trivy filesystem scan'
        required: false
        type: boolean
        default: true
      pip-version:
        description: "pip release to install for Python scanners (set to 'latest' to track upstream)"
        required: false
        type: string
        default: '24.3.1'
      skip-npm-signatures:
        description: 'Skip npm package signature verification'
        required: false
        type: boolean
        default: false
      skip-java-verify:
        description: 'Skip Maven/Gradle dependency verification'
        required: false
        type: boolean
        default: false
      skip-go-verify:
        description: 'Skip Go module verification'
        required: false
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  security:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    env:
      PIP_AUDIT_CACHE_DIR: ~/.cache/pip-audit
      TRIVY_CACHE_DIR: ~/.cache/trivy
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@cfd55ca82492758d853442341ad4d8010466803a
        with:
          python-version: '3.12'
          cache: pip
      - name: Cache pip-audit DB
        if: ${{ inputs['skip-python-scans'] == false }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.PIP_AUDIT_CACHE_DIR }}
          key: pip-audit-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
      - name: Cache Trivy DB
        if: ${{ inputs['skip-trivy'] == false }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.TRIVY_CACHE_DIR }}
          key: trivy-${{ runner.os }}
      - name: Prepare Python dependency audit target
        if: ${{ inputs['skip-python-scans'] == false }}
        shell: bash
        env:
          DEPENDENCY_INSTALL_COMMAND: ${{ inputs.dependency-install-command }}
          PIP_VERSION: ${{ inputs.pip-version }}
        run: |
          set -euo pipefail
          if [ "$PIP_VERSION" = "latest" ]; then
            python -m pip install --upgrade pip
          else
            python -m pip install --upgrade "pip==$PIP_VERSION"
          fi

          if [ -n "$DEPENDENCY_INSTALL_COMMAND" ]; then
            bash -euo pipefail -c "$DEPENDENCY_INSTALL_COMMAND"
            python -m pip freeze --exclude-editable               | grep -vEi '^(pip|setuptools|wheel)=='               > .security-scan-audit-requirements.txt || true
          fi

      - name: Install Python scanners
        if: ${{ inputs['skip-python-scans'] == false }}
        run: python -m pip install pip-audit==2.9.0 bandit==1.8.6

      - name: Python dependency scans
        if: ${{ inputs['skip-python-scans'] == false }}
        shell: bash
        env:
          SCAN_PATHS: ${{ inputs.paths }}
        run: |
          set -euo pipefail
          if [ -s .security-scan-audit-requirements.txt ]; then
            (
              pip-audit --strict                 --requirement .security-scan-audit-requirements.txt                 --format sarif                 -o pip-audit.sarif                 2>&1 | tee pip-audit.log
            ) &
          else
            (pip-audit --strict --format sarif -o pip-audit.sarif 2>&1 | tee pip-audit.log) &
          fi
          pid1=$!

          (bandit -r "$SCAN_PATHS" -ll -ii -f sarif -o bandit.sarif 2>&1 | tee bandit.log) &
          pid2=$!

          wait "$pid1" "$pid2"
      - name: Trivy (optional)
        if: ${{ inputs['skip-trivy'] == false }}
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          scan-type: fs
          scanners: vuln,secret,config
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
          exit-code: '1'
          path: ${{ inputs.paths }}
      - name: Set up Node (if needed)
        if: hashFiles('package-lock.json') != '' && inputs['skip-npm-signatures'] == false
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '20'
          cache: npm
      - name: Verify npm signatures
        if: hashFiles('package-lock.json') != '' && inputs['skip-npm-signatures'] == false
        run: |
          set -euo pipefail
          npm audit signatures
      - name: Set up Java (if needed)
        if: (hashFiles('pom.xml') != '' || hashFiles('build.gradle') != '' || hashFiles('build.gradle.kts') != '') && inputs['skip-java-verify'] == false
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Maven dependencies
        if: hashFiles('pom.xml') != '' && inputs['skip-java-verify'] == false
        run: |
          set -euo pipefail
          mvn -B -q -e -DskipTests verify
      - name: Verify Gradle dependencies
        if: (hashFiles('build.gradle') != '' || hashFiles('build.gradle.kts') != '') && inputs['skip-java-verify'] == false
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --write-verification-metadata sha256
      - name: Set up Go (if needed)
        if: hashFiles('go.sum') != '' && inputs['skip-go-verify'] == false
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.22'
      - name: Verify Go modules
        if: hashFiles('go.sum') != '' && inputs['skip-go-verify'] == false
        run: |
          set -euo pipefail
          go mod verify
      - name: Generate audit log
        if: ${{ always() }}
        run: |
          set -euo pipefail
          {
            echo "workflow: $GITHUB_WORKFLOW"
            echo "run-id: $GITHUB_RUN_ID"
            echo "repository: $GITHUB_REPOSITORY"
            echo "commit: $GITHUB_SHA"
            echo "timestamp: $(date -u +%FT%TZ)"
          } > audit.log
      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: security-reports
          path: |
            pip-audit.sarif
            bandit.sarif
            trivy.sarif
            pip-audit.log
            bandit.log
            audit.log
          if-no-files-found: ignore
      - name: Upload pip-audit report
        if: ${{ inputs['skip-python-scans'] == false && always() }}
        uses: github/codeql-action/upload-sarif@d8073367669608af8fbcc5f63dd0a0d52bb90cff
        with:
          sarif_file: pip-audit.sarif
      - name: Upload Bandit report
        if: ${{ inputs['skip-python-scans'] == false && always() }}
        uses: github/codeql-action/upload-sarif@d8073367669608af8fbcc5f63dd0a0d52bb90cff
        with:
          sarif_file: bandit.sarif
      - name: Upload Trivy report
        if: ${{ inputs['skip-trivy'] == false && always() }}
        uses: github/codeql-action/upload-sarif@d8073367669608af8fbcc5f63dd0a0d52bb90cff
        with:
          sarif_file: trivy.sarif

  provenance:
    name: Generate provenance
    needs: security
    if: ${{ always() && needs.security.result != 'cancelled' }}
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Download security reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: security-reports
          path: security-reports

      - name: Generate SLSA provenance
        id: slsa
        uses: actions/attest-build-provenance@ca0aaa1889e301c8331fbdb338d9475431b75b13
        with:
          subject-path: security-reports/**

      - name: Upload SLSA bundle
        if: ${{ steps.slsa.outputs.bundle-path != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: security-attestation
          path: ${{ steps.slsa.outputs.bundle-path }}
