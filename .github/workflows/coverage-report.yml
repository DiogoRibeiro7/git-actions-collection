name: Python Tests & Coverage
on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version"
        required: false
        type: string
        default: "3.12"
      test-command:
        description: "Test command"
        required: false
        type: string
        default: "pytest -q --maxfail=1 --disable-warnings --cov=. --cov-report=xml --cov-report=term"
      pip-version:
        description: "pip release to install (set to 'latest' to track upstream)"
        required: false
        type: string
        default: "24.3.1"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@cfd55ca82492758d853442341ad4d8010466803a
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Install project + test deps
        run: |
          set -euo pipefail
          pip_version="${{ inputs.pip-version }}"
          if [ "$pip_version" = "latest" ]; then
            python -m pip install --upgrade pip
          else
            python -m pip install --upgrade "pip==$pip_version"
          fi
          if [ -f pyproject.toml ]; then
            pip install . pytest pytest-cov
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt pytest pytest-cov
          fi
      - name: Run tests
        run: ${{ inputs.test-command }}
      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage.xml ] && grep -o 'line-rate="[^"]*' coverage.xml | head -1 || true
