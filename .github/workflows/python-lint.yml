name: Python Lint
on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.12'
      enable-mypy:
        description: 'Run mypy as well'
        required: false
        type: boolean
        default: false
      working-directory:
        description: 'Directory to lint, relative to the repository root'
        required: false
        type: string
        default: '.'
      pip-version:
        description: "pip release to install (set to 'latest' to track upstream)"
        required: false
        type: string
        default: '26.2.1'
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # The caller's code goes in project/ so linting never reaches the collection checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: project
      # Step-level ./ actions resolve in the caller's checkout, so fetch this collection
      # at the exact commit of this reusable workflow to run its composite actions.
      - name: Check out collection actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .git-actions-collection
          persist-credentials: false
      - name: Lint & Type Check
        uses: ./.git-actions-collection/.github/actions/python-lint
        with:
          working-directory: project/${{ inputs.working-directory }}
          python-version: ${{ inputs.python-version }}
          enable-mypy: ${{ inputs.enable-mypy }}
          pip-version: ${{ inputs.pip-version }}
