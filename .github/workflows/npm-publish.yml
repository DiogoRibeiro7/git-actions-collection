# Installs dependencies (Yarn or npm, chosen by lockfile), runs the build script if one exists, and
# publishes to npm with provenance under a configurable dist-tag.
name: Publish to npm
on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node version'
        required: false
        type: string
        default: '24'
      working-directory:
        description: 'Directory where package.json lives'
        required: false
        type: string
        default: '.'
      tag:
        description: 'npm dist-tag to publish under'
        required: false
        type: string
        default: 'latest'
      prerelease-id:
        description: 'Publish <version>-<id>.<run number>.<run attempt> instead of the package.json version, e.g. canary; empty publishes the version as is'
        required: false
        type: string
        default: ''
    secrets:
      NPM_TOKEN:
        description: 'npm token with publish rights to the package, used as NODE_AUTH_TOKEN'
        required: true
permissions:
  contents: read
  id-token: write  # for provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://registry.npmjs.org'
      - name: Enable Corepack and install deps
        run: |
          # Node.js 25 and newer no longer bundle Corepack.
          if [ "$(node -p 'process.versions.node.split(".")[0]')" -ge 25 ]; then
            npm install --global corepack@0.36.0
          fi
          corepack enable
          if [ -f yarn.lock ]; then
            yarn install --immutable
          elif [ -f package-lock.json ]; then
            npm ci
          else
            echo "No lockfile found; running npm i"
            npm i
          fi
      - name: Build (if script exists)
        run: |
          if npm run | grep -q '^  build'; then
            npm run build
          else
            echo "No build script, skipping"
          fi
      # npm refuses to publish a version twice, so repeated prerelease runs need unique versions.
      - name: Set prerelease version
        if: inputs.prerelease-id != ''
        env:
          PRERELEASE_ID: ${{ inputs.prerelease-id }}
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          version="${base}-${PRERELEASE_ID}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          npm version --no-git-tag-version "$version"
          echo "Publishing $version"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          npm publish --provenance --tag "$TAG"
