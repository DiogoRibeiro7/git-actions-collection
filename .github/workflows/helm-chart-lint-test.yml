# Runs helm lint and helm template on a chart and, when publishing is enabled, packages it and
# pushes to an OCI registry or releases it to GitHub Pages via chart-releaser.
name: Helm Chart Lint & Test
on:
  workflow_call:
    inputs:
      chart-path:
        description: 'Path to the Helm chart'
        required: false
        type: string
        default: '.'
      publish:
        description: 'Package and publish the chart'
        required: false
        type: boolean
        default: false
      oci-registry:
        description: 'OCI registry to push (if publish is true)'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Helm lint
        run: helm lint ${{ inputs.chart-path }}
      - name: Helm template dry-run
        run: helm template ${{ inputs.chart-path }} --dry-run
      - name: Package chart
        if: ${{ inputs.publish }}
        run: helm package ${{ inputs.chart-path }}
      - name: Publish to OCI registry
        if: ${{ inputs.publish && inputs.oci-registry != '' }}
        run: |
          export HELM_EXPERIMENTAL_OCI=1
          helm registry login ${{ inputs.oci-registry }} -u ${{ github.actor }} -p ${{ github.token }}
          helm push ./*.tgz oci://${{ inputs.oci-registry }}
      - name: Publish to GitHub Pages
        if: ${{ inputs.publish && inputs.oci-registry == '' }}
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f
        env:
          CR_TOKEN: ${{ github.token }}
        with:
          charts_dir: ${{ inputs.chart-path }}
