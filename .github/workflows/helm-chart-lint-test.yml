# Runs helm lint and helm template on a chart with a pinned Helm; publishing moved to
# helm-chart-release.yml.
name: Helm Chart Lint & Test
on:
  workflow_call:
    inputs:
      chart-path:
        description: 'Path to the Helm chart'
        required: false
        type: string
        default: '.'
      publish:
        description: 'Deprecated: publish with helm-chart-release.yml; true now fails the job'
        required: false
        type: boolean
        default: false
      oci-registry:
        description: 'Deprecated: set oci-repository on helm-chart-release.yml instead'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Publishing never worked here: this workflow's token can only read the repository.
      - name: Reject publishing
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          echo "::error::helm-chart-lint-test.yml no longer publishes charts. Call helm-chart-release.yml with dry-run: false instead."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v4.3.0
      - name: Helm lint
        shell: bash
        env:
          CHART_PATH: ${{ inputs.chart-path }}
        run: helm lint "$CHART_PATH"
      - name: Helm template
        shell: bash
        env:
          CHART_PATH: ${{ inputs.chart-path }}
        run: helm template "$CHART_PATH"
