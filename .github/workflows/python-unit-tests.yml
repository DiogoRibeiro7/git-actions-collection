name: Python Unit Tests
on:
  pull_request:
    paths:
      - 'tests/**'
      - 'scripts/**'
      - '.github/actions/**/action.yml'
      - 'pyproject.toml'
      - '.github/workflows/python-unit-tests.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest
      - name: Run pytest
        run: pytest -q
