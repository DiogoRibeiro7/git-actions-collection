name: Test Rust GitHub Release Workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/rust-github-release.yml'
      - '.github/workflows/test-rust-github-release.yml'
      - '.github/workflows/rust-release-preflight.yml'
      - 'examples/rust-crate/**'
      - 'tests/python/test_rust_github_release_workflow.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-github-release-dry-run:
    uses: ./.github/workflows/rust-github-release.yml
    with:
      rust-toolchain: stable
      working-directory: examples/rust-crate
      package-name: rust-crate
      tag-name: v0.1.0
      dry-run: true
      artifact-retention-days: 1
