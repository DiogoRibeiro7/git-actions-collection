# Checks commit messages against Conventional Commits, using webiny/action-conventional-commits on
# pull requests and commitlint on push events.
name: Conventional Commits
on:
  workflow_call: {}
permissions:
  contents: read
  pull-requests: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Conventional commits check (PR only)
        if: github.event_name == 'pull_request'
        uses: webiny/action-conventional-commits@8bc41ff4e7d423d56fa4905f6ff79209a78776c7
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Conventional commits check (push)
        if: github.event_name == 'push'
        run: |
          npx commitlint --version >/dev/null 2>&1 || npm i -g @commitlint/{config-conventional,cli}
          range="$(git rev-parse HEAD^)..HEAD"
          git log --format=%s "$range" | npx commitlint
