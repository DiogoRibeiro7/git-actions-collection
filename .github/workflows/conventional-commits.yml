name: Conventional Commits
on:
  workflow_call: {}
permissions:
  contents: read
  pull-requests: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Conventional commits check (PR only)
        if: github.event_name == 'pull_request'
        uses: webiny/action-conventional-commits@8bc41ff4e7d423d56fa4905f6ff79209a78776c7
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Conventional commits check (push to main/develop)
        if: github.event_name == 'push'
        run: |
          npx commitlint --version >/dev/null 2>&1 || npm i -g @commitlint/{config-conventional,cli}
          range="$(git rev-parse HEAD^)..HEAD"
          git log --format=%s $range | npx commitlint
