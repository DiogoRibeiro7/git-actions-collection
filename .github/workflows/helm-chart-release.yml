# Lints and packages a Helm chart, then pushes it to an OCI registry (GHCR by default) from a GitHub
# environment; dry run by default.
name: Helm Chart Release

on:
  workflow_call:
    inputs:
      chart-path:
        description: 'Path to the Helm chart'
        required: false
        type: string
        default: '.'
      oci-repository:
        description: 'OCI repository to push to, e.g. ghcr.io/my-org/charts; empty uses ghcr.io/<owner>/charts'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Only lint and package the chart; set to false to push it'
        required: false
        type: boolean
        default: true
      release-environment:
        description: 'GitHub environment the push job runs in'
        required: false
        type: string
        default: 'release'
    secrets:
      REGISTRY_USERNAME:
        description: 'Registry user for registries other than GHCR, which uses github.actor'
        required: false
      REGISTRY_PASSWORD:
        description: 'Registry password or token for registries other than GHCR, which uses GITHUB_TOKEN'
        required: false
    outputs:
      chart:
        description: 'File name of the packaged chart'
        value: ${{ jobs.package.outputs.chart }}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      chart: ${{ steps.package.outputs.chart }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v4.3.0
      - name: Lint chart
        shell: bash
        env:
          CHART_PATH: ${{ inputs.chart-path }}
        run: helm lint "$CHART_PATH"
      - name: Package chart
        id: package
        shell: bash
        env:
          CHART_PATH: ${{ inputs.chart-path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chart"
          helm package "$CHART_PATH" --destination "$RUNNER_TEMP/chart"
          charts=("$RUNNER_TEMP"/chart/*.tgz)
          echo "chart=$(basename "${charts[0]}")" >> "$GITHUB_OUTPUT"
      - name: Upload packaged chart
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: helm-chart
          path: ${{ runner.temp }}/chart/${{ steps.package.outputs.chart }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.release-environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download packaged chart
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: helm-chart
          path: ${{ runner.temp }}/chart
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v4.3.0
      - name: Push chart
        shell: bash
        env:
          REPOSITORY_INPUT: ${{ inputs.oci-repository }}
          OWNER: ${{ github.repository_owner }}
          CHART: ${{ needs.package.outputs.chart }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || github.token }}
        run: |
          set -euo pipefail
          # GHCR repository names must be lowercase.
          repository="${REPOSITORY_INPUT:-ghcr.io/${OWNER,,}/charts}"
          repository="${repository#oci://}"
          registry="${repository%%/*}"
          printf '%s' "$REGISTRY_PASSWORD" \
            | helm registry login "$registry" --username "$REGISTRY_USERNAME" --password-stdin
          helm push "$RUNNER_TEMP/chart/$CHART" "oci://$repository"
