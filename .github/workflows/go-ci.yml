# Runs go test ./... and golangci-lint 2.14.0 on Ubuntu with a configurable Go version, defaulting
# to 1.27.
name: Go CI

on:
  workflow_call:
    inputs:
      go-version:
        description: Go version
        required: false
        type: string
        default: '1.27'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ inputs.go-version }}
      - name: Run tests
        run: go test ./...
      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@e7fa5ac41e1cf5b7d48e45e42232ce7ada589601
        with:
          # Pinned: `latest` changed lint results without a change in the caller's code.
          version: v2.14.0
