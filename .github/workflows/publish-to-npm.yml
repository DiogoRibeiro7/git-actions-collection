name: Publish to npm (compatibility alias)

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/npm-publish.yml
    with:
      node-version: ${{ inputs.node-version }}
      working-directory: .
      tag: latest
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
