name: PR Policy
on:
  workflow_call:
permissions:
  contents: read
  pull-requests: write
jobs:
  label-and-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Step-level ./ actions resolve in the caller's checkout, so fetch this collection
      # at the exact commit of this reusable workflow to run its composite actions.
      - name: Check out collection actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .git-actions-collection
          persist-credentials: false
      - name: Enforce PR template
        uses: ./.git-actions-collection/.github/actions/pr-template-enforcer
      - name: Label PR size
        uses: codelytv/pr-size-labeler@095a41fca88b8764fd9e008ad269bcdb82bb38b9
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Path labels are opt-in: labeler v6 fails without a caller-owned config in the
      # v5+ match-object format.
      - name: Label PR by changed paths
        if: hashFiles('.github/labeler.yml') != ''
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
