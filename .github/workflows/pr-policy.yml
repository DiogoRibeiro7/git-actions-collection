name: PR Policy
on:
  workflow_call:
permissions:
  contents: read
  pull-requests: write
jobs:
  label-and-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@5
      - name: Enforce PR template
        uses: ./.github/actions/pr-template-enforcer
      - name: Label PR size
        uses: codelytv/pr-size-labeler@1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Auto label by paths (example)
        uses: actions/labeler@6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
