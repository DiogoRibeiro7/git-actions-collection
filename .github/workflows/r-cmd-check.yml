# Runs R CMD check for an R package across a configurable R and operating-system matrix.
# Dependencies are installed from DESCRIPTION before rcmdcheck runs, and the check result is fatal by default.
name: R CMD check

on:
  workflow_call:
    inputs:
      r-versions:
        description: JSON array of R versions such as ["release"] or ["release","devel"]
        required: false
        type: string
        default: '["release"]'
      os-matrix:
        description: JSON array of GitHub-hosted runner labels
        required: false
        type: string
        default: '["ubuntu-latest"]'
      working-directory:
        description: Directory containing DESCRIPTION
        required: false
        type: string
        default: .
      check-args:
        description: JSON array of extra arguments passed to R CMD check
        required: false
        type: string
        default: '["--no-manual"]'
      error-on:
        description: "rcmdcheck error threshold: error, warning, or note"
        required: false
        type: string
        default: error

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / R ${{ matrix.r }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-matrix) }}
        r: ${{ fromJSON(inputs.r-versions) }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
          http-user-agent: ${{ runner.os }}-${{ runner.arch }}

      - name: Install check tooling
        run: |
          Rscript -e 'install.packages(c("jsonlite", "remotes", "rcmdcheck"), repos = "https://cloud.r-project.org")'

      - name: Validate package and inputs
        env:
          ERROR_ON: ${{ inputs.error-on }}
          CHECK_ARGS: ${{ inputs.check-args }}
        run: |
          set -euo pipefail
          test -f DESCRIPTION || {
            echo "::error::DESCRIPTION not found in ${{ inputs.working-directory }}"
            exit 1
          }
          case "${ERROR_ON}" in
            error|warning|note) ;;
            *)
              echo "::error::error-on must be one of: error, warning, note"
              exit 2
              ;;
          esac
          Rscript -e 'args <- jsonlite::fromJSON(Sys.getenv("CHECK_ARGS")); if (!is.character(args)) stop("check-args must be a JSON string array")' \
            2>/dev/null || {
              echo "::error::check-args must be a JSON array of strings"
              exit 2
            }

      - name: Install package dependencies
        run: |
          Rscript -e 'remotes::install_deps(dependencies = TRUE, upgrade = "never")'

      - name: Run R CMD check
        env:
          CHECK_ARGS: ${{ inputs.check-args }}
          ERROR_ON: ${{ inputs.error-on }}
        run: |
          Rscript - <<'RSCRIPT'
          args <- jsonlite::fromJSON(Sys.getenv("CHECK_ARGS"))
          rcmdcheck::rcmdcheck(
            args = args,
            error_on = Sys.getenv("ERROR_ON"),
            check_dir = file.path(tempdir(), "check")
          )
          RSCRIPT
