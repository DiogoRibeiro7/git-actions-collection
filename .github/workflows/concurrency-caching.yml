# Runs npm ci and npm test (if present) on Node 24 with npm caching, cancelling superseded runs for
# the same caller workflow and ref.
name: Concurrency and Caching Template

on:
  workflow_call:

# In a reusable workflow github.workflow is the caller's name, so without a prefix this group
# matched a caller using the same pattern, and the run cancelled or blocked its own caller.
concurrency:
  group: concurrency-caching-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test --if-present
