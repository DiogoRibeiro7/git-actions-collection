name: Python CI
'on':
  push:
    branches:
    - main
  pull_request: null
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.x
        cache: pip
    - run: pip install -r requirements.txt
    - run: pytest -q
