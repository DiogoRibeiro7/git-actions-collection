name: Node CI
'on':
  push:
    branches:
    - main
  pull_request: null
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '20'
        cache: yarn
    - run: corepack enable
    - run: yarn install --immutable
    - run: yarn test
