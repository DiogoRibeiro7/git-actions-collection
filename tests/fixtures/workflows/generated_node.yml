name: Node CI
'on':
  push:
    branches:
    - main
  pull_request: null
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '20'
        cache: yarn
    - run: corepack enable
    - run: yarn install --immutable
    - run: yarn test
