name: Python package
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  ci:
    permissions:
      contents: read
    uses: DiogoRibeiro7/git-actions-collection/.github/workflows/python-test-matrix.yml@v1
    with:
      python-versions: '["3.9", "3.10", "3.11"]'
      os-matrix: '["ubuntu-latest"]'
      test-command: pytest
