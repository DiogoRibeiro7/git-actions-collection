site_name: git-actions-collection
site_description: Reusable GitHub Actions workflows and composite actions.
site_url: https://diogoribeiro7.github.io/git-actions-collection/
repo_url: https://github.com/DiogoRibeiro7/git-actions-collection
repo_name: DiogoRibeiro7/git-actions-collection
# Pages come from across the repository, so edit links are relative to its root.
edit_uri: edit/main/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - content.action.edit
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/docs_site.py
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
