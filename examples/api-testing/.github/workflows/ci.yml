name: Example API Tests
on: [push]

jobs:
  build:
    uses: DiogoRibeiro7/git-actions-collection/.github/workflows/node-ci.yml@develop
    with:
      node-version: '20'
  api-tests:
    needs: build
    uses: DiogoRibeiro7/git-actions-collection/.github/workflows/api-testing.yml@develop
    with:
      openapi-spec: openapi.yaml
      contract-path: postman-collection.json
      base-url: https://httpbin.org
      load-script: k6-script.js
      run-zap: false
