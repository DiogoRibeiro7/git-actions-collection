name: Monorepo CI

on:
  push:
  pull_request:

jobs:
  matrix:
    uses: DiogoRibeiro7/git-actions-collection/.github/workflows/ci-monorepo-matrix.yml@v1
    with:
      # Each top-level folder maps to a check the runner knows: python, node, java, rust,
      # go, terraform, k8s, helm or docker.
      groups: '{"pkg-a": "python", "web-app": "node", "infra": "terraform"}'
