name: Database Migration Example

on:
  push:
    branches: [ main ]

jobs:
  migrate:
    uses: DiogoRibeiro7/git-actions-collection/.github/workflows/database-migration.yml@v1
    with:
      tool: flyway
      migration-dir: migrations
      environments: '["dev"]'
    # Secret names depend on the environment list, so pass them all through.
    secrets: inherit
