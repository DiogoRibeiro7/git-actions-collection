name: Cleanup
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
jobs:
  cleanup:
    uses: DiogoRibeiro7/git-actions-collection/.github/workflows/artifact-management.yml@develop
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      retention-days: 14
      keep-latest: 3
      package-name: ghcr.io/example/app
