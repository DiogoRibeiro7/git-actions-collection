name: Canary Release

on:
  push:
    branches: [ develop ]
    tags: [ "*-rc*" ]

jobs:
  release:
    uses: DiogoRibeiro7/git-actions-collection/.github/workflows/canary-release.yml@develop
    with:
      project-type: docker
      image: ghcr.io/${{ github.repository }}
      working-directory: .
