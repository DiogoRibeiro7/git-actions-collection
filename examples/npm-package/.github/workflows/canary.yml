name: Canary Release

on:
  push:
    branches: [ main ]
    tags: [ "*-rc*" ]

jobs:
  release:
    uses: DiogoRibeiro7/git-actions-collection/.github/workflows/canary-release.yml@main
    with:
      project-type: npm
      working-directory: .
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
